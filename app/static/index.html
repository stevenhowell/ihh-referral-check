<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fetch</title>
<style>
:root {
  --bg: #f5f5f7; --panel: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --line: #e3e3e8;
  --accent: #0a66d8; --accent-press: #0852ad; --accent-soft: #e8f1fc;
  --red: #c4291c; --red-soft: #fdeceb; --amber: #a35a00; --amber-soft: #fdf3e3;
  --green: #1f7a3a; --green-soft: #e9f6ed; --purple: #6b3fb5; --purple-soft: #f1ecfa;
  --row: #fafafc; --mark: #ffe58a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161618; --panel: #1f1f22; --text: #f2f2f5; --muted: #a1a1a8; --line: #333338;
    --accent: #4a9bff; --accent-press: #2f86f0; --accent-soft: #1c2b40;
    --red: #ff6b5e; --red-soft: #3a1f1d; --amber: #f0a542; --amber-soft: #382a17;
    --green: #5fd27f; --green-soft: #18301f; --purple: #b69cff; --purple-soft: #2a2238;
    --row: #242428; --mark: #6b5a12;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; }
button { font: inherit; }
header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 17px; margin: 0; }
header .sub { color: var(--muted); font-size: 13px; }
.seg { margin-left: auto; display: flex; background: var(--bg); border-radius: 9px; padding: 2px; }
.seg button { border: 0; background: transparent; color: var(--text); padding: 8px 16px; min-height: 36px; border-radius: 7px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 600; }
.layout { display: grid; grid-template-columns: 250px 1fr; min-height: calc(100vh - 61px); }
nav { border-right: 1px solid var(--line); background: var(--panel); padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
nav .item { display: block; width: 100%; text-align: left; border: 0; background: transparent; color: var(--text); padding: 9px 12px; border-radius: 8px; cursor: pointer; min-height: 44px; }
nav .item:hover { background: var(--bg); }
nav .item:active { background: var(--line); }
nav .item[aria-current="true"] { background: var(--accent-soft); }
nav .item b { font-weight: 600; }
nav .item .st { display: block; font-size: 12.5px; color: var(--muted); }
nav .open { margin-top: 10px; }
main { padding: 24px 28px 60px; max-width: 980px; width: 100%; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 0 16px; min-height: 44px; border-radius: 10px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn:active { background: var(--bg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:active { background: var(--accent-press); }
.btn:disabled { opacity: .5; cursor: default; }
.empty { text-align: center; padding: 70px 20px; color: var(--muted); }
.empty h2 { color: var(--text); font-size: 22px; margin: 0 0 8px; }
.empty p { max-width: 460px; margin: 0 auto 20px; }
.acro { color: var(--text); letter-spacing: .01em; }
.acro b { color: var(--accent); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-bottom: 18px; }
.verdict { display: flex; gap: 18px; align-items: flex-start; }
.verdict .label { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.verdict .call { font-size: 26px; font-weight: 700; margin: 2px 0 6px; }
.call.approve { color: var(--green); } .call.deny { color: var(--red); } .call.need_more_info { color: var(--amber); }
.meta { color: var(--muted); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.banner { border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; background: var(--red-soft); color: var(--red); font-weight: 600; }
h3 { font-size: 15px; margin: 26px 0 10px; display: flex; align-items: center; gap: 8px; }
h3 .count { color: var(--muted); font-weight: 400; }
.finding { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
.finding.problem { border-left-color: var(--red); } .finding.cant_tell { border-left-color: var(--amber); }
.finding.missing { border-left-color: var(--amber); } .finding.ok { border-left-color: var(--green); }
.finding.conflict, .finding.coordinator_call { border-left-color: var(--purple); }
.imgcheck { font-size: 12px; margin-top: 2px; }
.imgcheck.yes { color: var(--green); } .imgcheck.no { color: var(--red); font-weight: 600; } .imgcheck.unclear { color: var(--amber); }
.formonly { font-size: 12.5px; color: var(--amber); margin-top: 6px; font-weight: 600; }
.groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.group { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--row); }
.group .g { font-size: 13px; color: var(--muted); }
.group .r { font-weight: 700; }
.r.pass { color: var(--green); } .r.fail { color: var(--red); } .r.cant { color: var(--amber); } .r.judge { color: var(--purple); }
.quote .side { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; max-width: 200px; text-align: right; }
.badge { font-size: 12.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; display: inline-block; }
.badge.ok { color: var(--green); background: var(--green-soft); }
.badge.bad { color: var(--red); background: var(--red-soft); }
.badge-why { font-size: 12px; color: var(--red); }
.trust { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.tag { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; }
.tag.problem { color: var(--red); background: var(--red-soft); }
.tag.coordinator_call, .tag.conflict { color: var(--purple); background: var(--purple-soft); }
details.fold { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px 14px; margin-bottom: 8px; }
details.fold > summary { color: var(--text); font-weight: 600; min-height: 44px; display: flex; align-items: center; gap: 8px; }
details.fold[open] { padding-bottom: 10px; }
.call .lean { font-weight: 500; }
.finding .head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.finding .head strong { font-weight: 600; }
.finding .rule { font-size: 12.5px; color: var(--muted); }
.finding .expl { margin: 4px 0 0; }
.finding .ruletext { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.unsupported { font-size: 12.5px; color: var(--red); margin-top: 6px; font-weight: 600; }
.quote { display: flex; gap: 10px; align-items: flex-start; margin-top: 8px; padding: 8px 10px; background: var(--row); border-radius: 8px; }
.quote q { flex: 1; font-style: italic; }
.pagebtn { border: 1px solid var(--line); background: var(--panel); color: var(--accent); border-radius: 8px; min-height: 32px; min-width: 52px; padding: 0 8px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.pagebtn:active { background: var(--accent-soft); }
.check { font-size: 12px; white-space: nowrap; padding-top: 6px; }
.check.on_page, .check.close { color: var(--green); }
.check.other_page { color: var(--amber); } .check.not_found { color: var(--red); font-weight: 600; }
details > summary { cursor: pointer; color: var(--accent); min-height: 32px; padding-top: 4px; }
ul.ask { margin: 0; padding-left: 20px; }
textarea { width: 100%; min-height: 150px; border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: inherit; background: var(--panel); color: var(--text); resize: vertical; }
.row { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.viewer { position: fixed; top: 61px; right: 0; bottom: 0; width: min(560px, 48vw); background: var(--panel); border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0,0,0,.08); display: flex; flex-direction: column; z-index: 10; }
.viewer[hidden] { display: none; }
.viewer .bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.viewer .bar .t { flex: 1; font-weight: 600; }
.viewer .body { overflow: auto; padding: 14px; }
.viewer img { width: 100%; border: 1px solid var(--line); border-radius: 6px; background: #fff; display: block; }
.pagewrap { position: relative; }
.hl { position: absolute; border: 3px solid var(--accent); background: rgba(10, 102, 216, .14); border-radius: 4px; pointer-events: none; }
.hl[hidden] { display: none; }
.viewer pre { white-space: pre-wrap; font: 13px/1.5 ui-monospace, Menlo, monospace; background: var(--row); padding: 12px; border-radius: 8px; }
mark { background: var(--mark); color: inherit; }
table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 12px; overflow: hidden; }
th, td { text-align: left; padding: 10px 12px; font-size: 14px; }
th { font-size: 12.5px; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); }
tbody tr:nth-child(even) { background: var(--row); }
.big { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
.spinner { width: 22px; height: 22px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  nav { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  nav .item { width: auto; min-width: 120px; }
  main { padding: 16px; }
  .viewer { width: 100vw; }
}
</style>
</head>
<body>
<header>
  <div>
    <h1>Fetch</h1>
    <div class="sub">Referral review for Illumination Health + Home</div>
  </div>
  <div class="seg" role="group" aria-label="View">
    <button id="tab-packets" aria-pressed="true">Packets</button>
    <button id="tab-score" aria-pressed="false">Score</button>
  </div>
</header>
<div class="layout">
  <nav id="list" aria-label="Packets"></nav>
  <main id="main"></main>
</div>
<aside class="viewer" id="viewer" hidden aria-label="Page viewer">
  <div class="bar">
    <button class="btn" id="v-prev" aria-label="Previous page">‹</button>
    <span class="t" id="v-title"></span>
    <button class="btn" id="v-next" aria-label="Next page">›</button>
    <button class="btn" id="v-close">Close</button>
  </div>
  <div class="body">
    <div id="v-note" class="meta"></div>
    <div class="pagewrap"><img id="v-img" alt=""><div class="hl" id="v-hl" hidden></div></div>
    <details id="v-tr-wrap"><summary>Show what Claude read on this page</summary><pre id="v-tr"></pre></details>
  </div>
</aside>
<input type="file" id="file" accept="application/pdf,image/jpeg,image/png,image/heic,.heic" hidden>
<script>
const state = { view: "packets", selected: null, packets: [], review: null, viewer: null };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const CALL = { approve: "Approve", deny: "Deny", need_more_info: "Needs more information" };
const CHECK = {
  on_page: "✓ On the page",
  close: "≈ On the page, small reading differences",
  other_page: (e) => `! Found on page ${e.found_on}, not ${e.page}`,
  not_found: "✗ Not found on the page. Check by hand",
};

async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || `Request failed (${r.status})`);
  return body;
}

function statusLine(p) {
  if (p.state === "running") return esc(p.step || "Reviewing");
  if (p.state === "error") return "Stopped. Open for details";
  if (p.state === "done") return `Fetch suggests: ${suggestionText(p.decision, p.lean).toLowerCase()}`;
  if (p.state === "changed") return "File changed. Review hidden";
  return "Not reviewed";
}

function renderList() {
  const items = state.packets.map((p) => `
    <button class="item" data-id="${p.id}" aria-current="${p.id === state.selected && state.view === "packets"}">
      <b>${p.uploaded ? "Opened packet " + p.id.slice(1) : "Packet " + p.id}</b>
      <span class="st">${statusLine(p)}</span>
    </button>`).join("");
  $("list").innerHTML = items + `<button class="btn open" id="open-btn">Open packet…</button>`;
  $("list").querySelectorAll(".item").forEach((b) => b.onclick = () => select(b.dataset.id));
  $("open-btn").onclick = () => $("file").click();
}

async function refresh() {
  const { packets } = await api("/api/packets");
  state.packets = packets;
  renderList();
  if (state.view === "packets" && state.selected) {
    const p = packets.find((x) => x.id === state.selected);
    if (p && (p.state !== "done" || !state.review || state.review.packet_id !== p.id)) await renderPacket();
  }
  if (state.view === "score") await renderScore(true);
  const running = packets.some((p) => p.state === "running");
  clearTimeout(state.timer);
  if (running) state.timer = setTimeout(refresh, 2000);
}

async function select(id) {
  state.view = "packets"; state.selected = id; state.review = null;
  setTab();
  closeViewer();
  renderList();
  await renderPacket();
}

async function startReview(id, fresh) {
  await api(`/api/review/${id}${fresh ? "?fresh=1" : ""}`, { method: "POST" });
  state.review = null;
  await refresh();
}

async function renderPacket() {
  const p = state.packets.find((x) => x.id === state.selected);
  const main = $("main");
  if (!p) return;
  const name = p.uploaded ? `Opened packet ${p.id.slice(1)}` : `Packet ${p.id}`;
  if (p.state === "new") {
    main.innerHTML = `<div class="empty"><h2>${name} hasn't been fetched</h2>
      <p>Fetch reads every page of the fax and checks it against IHH's admission rules. Each finding shows the page and the words it came from. It takes about three minutes.</p>
      <button class="btn primary" id="go">Fetch</button></div>`;
    $("go").onclick = () => startReview(p.id);
    return;
  }
  if (p.state === "running") {
    main.innerHTML = `<div class="empty"><h2><span class="spinner"></span>&nbsp; Reviewing ${name}</h2><p>${esc(p.step)}</p></div>`;
    return;
  }
  if (p.state === "changed") {
    main.innerHTML = `<div class="empty"><h2>${name} changed after it was reviewed</h2>
      <p>The file no longer matches the one Fetch read, so its review is hidden. Fetch it again to review the file as it is now.</p>
      <button class="btn primary" id="go">Fetch again</button></div>`;
    $("go").onclick = () => startReview(p.id, true);
    return;
  }
  if (p.state === "error") {
    main.innerHTML = `<div class="empty"><h2>The review of ${name} stopped</h2><p>${esc(p.error)}</p>
      <button class="btn primary" id="go">Review again</button></div>`;
    $("go").onclick = () => startReview(p.id, true);
    return;
  }
  if (!state.review || state.review.packet_id !== p.id) state.review = await api(`/api/review/${p.id}`);
  main.innerHTML = reviewHTML(state.review, name);
  main.querySelectorAll(".pagebtn").forEach((b) => b.onclick = () => openViewer(+b.dataset.page, b.dataset.quote, b.dataset.box ? JSON.parse(b.dataset.box) : null));
  const copy = $("copy");
  if (copy) copy.onclick = async () => {
    try { await navigator.clipboard.writeText($("reply").value); copy.textContent = "Copied"; }
    catch { copy.textContent = "Select the text and copy it"; }
    setTimeout(() => copy.textContent = "Copy reply", 2000);
  };
  const again = $("again");
  if (again) again.onclick = () => startReview(p.id, true);
}

// One badge per quote. "Checked" means it was found in Fetch's reading of the page AND on the page image.
function trust(e) {
  const textOk = e.check === "on_page" || e.check === "close";
  const imageOk = e.image_check === undefined ? null : e.image_check === "yes";
  if (textOk && imageOk) return `<span class="badge ok" title="Found word for word in the page text and seen on the page image">✓ Checked</span>`;
  if (textOk && imageOk === null) return `<span class="badge ok" title="Found in the page text; not yet checked on the image">✓ In the page text</span>`;
  let why = "Not found on this page";
  if (e.check === "other_page") why = `It's on page ${e.found_on}, not ${e.page}`;
  else if (textOk && e.image_check === "unclear") why = "Hard to read on the page image";
  else if (textOk) why = "Not seen on the page image";
  const says = e.image_says ? `<div class="badge-why">Page shows: ${esc(e.image_says)}</div>` : "";
  return `<span class="badge bad">Check by hand</span><div class="badge-why">${why}</div>${says}`;
}
function quoteHTML(e) {
  return `<div class="quote">
    <button class="pagebtn" data-page="${e.page}" data-quote="${esc(e.quote)}" data-box="${e.box ? esc(JSON.stringify(e.box)) : ""}" aria-label="Open page ${e.page}">p. ${e.page}</button>
    <q>${esc(e.quote)}</q>
    <span class="side">${trust(e)}</span></div>`;
}

const TAG = { problem: "Rules them out", coordinator_call: "Your call", conflict: "Pages disagree" };
function findingHTML(f) {
  const kind = f.status || "conflict";
  const tag = TAG[kind] ? `<span class="tag ${kind}">${TAG[kind]}</span>` : "";
  const rule = f.rule_id ? `<span class="rule">${esc(f.rule_id)}${f.known_rule ? "" : " (not an IHH rule ID)"}</span>` : "";
  return `<div class="finding ${kind}">
    <div class="head">${tag}<strong>${esc(f.headline || f.topic)}</strong>${rule}</div>
    <p class="expl">${esc(f.explanation)}</p>
    ${f.rule_text ? `<div class="ruletext">IHH rule: ${esc(f.rule_text)}</div>` : ""}
    ${f.form_only ? `<div class="formonly">Only the referral form says this. The chart doesn't confirm it.</div>` : ""}
    ${f.supported === false ? `<div class="unsupported">None of its quotes checked out. Treat this finding as unchecked.</div>` : ""}
    ${f.evidence.map(quoteHTML).join("")}
  </div>`;
}

function folded(title, items) {
  if (!items.length) return "";
  return `<details class="fold"><summary>${title} <span class="count">${items.length}</span></summary>${items.map(findingHTML).join("")}</details>`;
}

const GROUPS = [["GEN", "General"], ["ADL", "Daily living"], ["MOB", "Mobility"], ["MH", "Mental health"],
  ["COG", "Cognition"], ["OTH", "Other factors"], ["INF", "Infection control"], ["EOL", "End of life"], ["DOC", "Documents"], ["FORM", "Referral form"]];
function groupOf(id) { const pre = id.split("-")[0]; const g = GROUPS.find(([k]) => k === pre); return g ? g[1] : "Conditions"; }
function groupsHTML(findings) {
  const order = [...GROUPS.map(([, n]) => n), "Conditions"];
  const groups = {};
  for (const f of findings) (groups[groupOf(f.rule_id)] ||= []).push(f);
  const cells = order.filter((n) => groups[n]).map((n) => {
    const fs = groups[n], has = (st) => fs.some((f) => f.status === st);
    const shaky = fs.some((f) => f.status === "ok" && (f.form_only || !f.supported));
    const [cls, word] = has("problem") ? ["fail", "Fail"] : has("coordinator_call") ? ["judge", "Your call"]
      : has("cant_tell") || has("missing") || shaky ? ["cant", "Can't tell"] : ["pass", "Pass"];
    return `<div class="group"><div class="g">${n}</div><div class="r ${cls}">${word}</div></div>`;
  }).join("");
  return `<div class="groups">${cells}</div>`;
}

function suggestionText(decision, lean) {
  return decision === "need_more_info" ? `${CALL[decision]}, leaning ${lean}` : CALL[decision];
}

function reviewHTML(r, name) {
  const rv = r.review, s = rv.suggestion, qc = r.quote_check;
  const by = (st) => rv.findings.filter((f) => f.status === st);
  const flagged = r.pages.filter((p) => p.possible_unredacted_identifier).map((p) => p.page);
  const quotes = [...rv.findings, ...rv.conflicts].flatMap((f) => f.evidence);
  const handCheck = quotes.filter((e) => !(e.check === "on_page" || e.check === "close") || (e.image_check && e.image_check !== "yes")).length;
  const mins = Math.floor(r.seconds / 60), secs = r.seconds % 60;
  const first = [...by("problem"), ...by("coordinator_call"), ...rv.conflicts];
  const trustLine = handCheck
    ? `<span class="badge bad">${handCheck} of ${quotes.length} quotes to check by hand</span>`
    : `<span class="badge ok">✓ All ${quotes.length} quotes checked against the page text and image</span>`;
  return `
  ${flagged.length ? `<div class="banner">Page ${flagged.join(", ")} may show an identifier the redaction missed. Stop and tell an organizer before going further.</div>` : ""}
  <div class="card verdict"><div style="flex:1">
    <div class="label">${esc(name)} · Fetch suggests</div>
    <div class="call ${s.decision}">${esc(suggestionText(s.decision, s.lean_if_forced))}</div>
    <div>${esc(s.why)}</div>
    <div class="trust">${trustLine}<span class="badge ok" title="SHA-256 ${esc(r.sha256 || "")}">✓ Original file unchanged</span></div>
    <p class="meta" style="margin:10px 0 0">Read ${r.page_count} page${r.page_count === 1 ? "" : "s"} in ${mins} min ${secs} s. Fetch suggests; the coordinator decides.</p>
  </div></div>
  ${groupsHTML(rv.findings)}
  ${first.length ? `<h3>Look at these first <span class="count">${first.length}</span></h3>${first.map(findingHTML).join("")}`
    : `<h3>Look at these first</h3><div class="card meta">Nothing in this packet rules the patient out or needs your judgment.</div>`}
  <h3>Reply to the hospital</h3>
  <div class="card">
    ${rv.ask_hospital.length ? `<div class="meta">Ask for:</div><ul class="ask">${rv.ask_hospital.map((a) => `<li>${esc(a)}</li>`).join("")}</ul>` : ""}
    <textarea id="reply" aria-label="Reply draft">${esc(rv.reply_draft)}</textarea>
    <div class="row"><button class="btn" id="copy">Copy reply</button><span class="meta">A draft to edit. Nothing is sent from here.</span></div></div>
  <h3>Everything else</h3>
  ${folded("Can't tell from this packet", by("cant_tell"))}
  ${folded("Missing documents", by("missing"))}
  ${folded("Meets the rule", by("ok"))}
  <p class="meta" style="margin-top:14px">${esc(rv.summary)}</p>
  <div class="row" style="margin-top:20px"><button class="btn" id="again">Fetch again</button><span class="meta">Checks the rules again on the pages already read.</span></div>`;
}

async function openViewer(page, quote, box) {
  const r = state.review;
  state.viewer = { page, quote };
  const hl = $("v-hl");
  hl.hidden = true;
  if (box) {
    const pad = 0.006;
    Object.assign(hl.style, { left: `${(box[0] - pad) * 100}%`, top: `${(box[1] - pad) * 100}%`,
      width: `${(box[2] - box[0] + 2 * pad) * 100}%`, height: `${(box[3] - box[1] + 2 * pad) * 100}%` });
    hl.hidden = false;
    $("v-img").onload = () => hl.scrollIntoView({ block: "center", behavior: "smooth" });
  } else { $("v-img").onload = null; }
  const info = r.pages.find((p) => p.page === page) || {};
  $("viewer").hidden = false;
  $("v-title").textContent = `Page ${page} of ${r.page_count}`;
  const notes = [info.kind ? info.kind.replace(/_/g, " ") : "", info.rotated ? "scanned sideways or upside down" : "", info.legibility && info.legibility !== "clear" ? info.legibility.replace(/_/g, " ") : ""].filter(Boolean);
  $("v-note").textContent = notes.join(" · ");
  if (info.possible_unredacted_identifier) $("v-note").innerHTML += `<div class="banner" style="margin-top:8px">This page may show an identifier the redaction missed. Stop and tell an organizer.</div>`;
  $("v-img").src = `/page/${r.packet_id}/${page}.png`;
  $("v-img").alt = `Page ${page} of packet ${r.packet_id}`;
  $("v-prev").disabled = page <= 1;
  $("v-next").disabled = page >= r.page_count;
  try {
    const t = await api(`/api/transcript/${r.packet_id}/${page}`);
    let html = esc(t.transcript);
    if (quote) {
      const i = t.transcript.toLowerCase().indexOf(quote.toLowerCase());
      if (i >= 0) {
        html = esc(t.transcript.slice(0, i)) + "<mark>" + esc(t.transcript.slice(i, i + quote.length)) + "</mark>" + esc(t.transcript.slice(i + quote.length));
        $("v-tr-wrap").open = true;
      }
    }
    $("v-tr").innerHTML = html;
  } catch { $("v-tr").textContent = "No transcript for this page."; }
}
function closeViewer() { $("viewer").hidden = true; state.viewer = null; }
$("v-close").onclick = closeViewer;
$("v-prev").onclick = () => openViewer(state.viewer.page - 1);
$("v-next").onclick = () => openViewer(state.viewer.page + 1);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.viewer) closeViewer(); });

function denialsHTML(denials) {
  const intro = `<h3>Why IHH may have denied these</h3>
    <p class="meta">IHH didn't record its reasons. These are Claude's reading of each denied packet against IHH's rules, made afterwards with the decision known. They are guesses until IHH staff confirm them, and the review never sees them.</p>`;
  if (!denials) return intro + `<div class="card meta">No reasons worked out yet.</div>`;
  const tool = (d) => d.tool_flagged === undefined ? `<span class="meta">Not reviewed</span>`
    : d.tool_flagged.length ? `Yes: ${d.tool_flagged.map(esc).join(", ")}` : "<b>No</b>";
  return intro + `<table><thead><tr><th>Packet</th><th>Likely reason</th><th>Rules</th><th>Pages</th><th>Status</th><th>Tool flagged it</th></tr></thead><tbody>
    ${denials.map((d) => d.reason ? `<tr><td>${d.id}</td><td>${esc(d.reason)}${d.confidence ? `<div class="meta">Confidence: ${esc(d.confidence)}</div>` : ""}</td>
      <td>${(d.rule_ids || []).map(esc).join(", ")}</td><td>${(d.pages || []).join(", ")}</td>
      <td>${d.confirmed_by_ihh ? "Confirmed by IHH staff" : "Our guess"}</td><td>${tool(d)}</td></tr>`
      : `<tr><td>${d.id}</td><td colspan="5" class="meta">No likely reason found yet.</td></tr>`).join("")}
  </tbody></table>`;
}

async function renderScore(quiet) {
  const { rows, denials } = await api("/api/score");
  const done = rows.filter((r) => r.state === "done");
  const matched = done.filter((r) => r.match).length;
  const waiting = rows.filter((r) => r.state !== "done" && r.state !== "running");
  const running = rows.filter((r) => r.state === "running");
  const quotes = done.reduce((a, r) => a + r.quote_check.quotes, 0);
  const both = (q) => q.image ? Math.min(q.on_page + q.close, q.image.seen) : q.on_page + q.close;
  const ok = done.reduce((a, r) => a + both(r.quote_check), 0);
  const head = done.length
    ? `<p class="big">Matched IHH's decision on ${matched} of ${done.length} packets</p>
       <p class="meta">${ok} of ${quotes} quotes checked against the page text and image. When Fetch asks for more information, its leaning is what's compared with IHH.</p>`
    : `<p class="big">No packets reviewed yet</p><p class="meta">Review the packets to compare the tool with what IHH actually decided.</p>`;
  const table = `<table><thead><tr><th>Packet</th><th>Pages</th><th>Fetch suggests</th><th>IHH decided</th><th>Match</th><th>Quotes checked</th><th>Time</th></tr></thead><tbody>
    ${rows.map((r) => r.state === "done" ? `<tr><td>${r.id}</td><td>${r.pages}</td><td>${esc(suggestionText(r.decision, r.lean))}</td><td>${CALL[r.ihh]}</td>
      <td>${r.match ? "Yes" : "<b>No</b>"}</td><td>${both(r.quote_check)} of ${r.quote_check.quotes}</td><td>${Math.round(r.seconds / 60 * 10) / 10} min</td></tr>`
      : `<tr><td>${r.id}</td><td colspan="6" class="meta">${r.state === "running" ? "Reviewing…" : r.state === "error" ? "Stopped" : "Not reviewed"}</td></tr>`).join("")}
  </tbody></table>`;
  $("main").innerHTML = `<div class="card">${head}
    ${waiting.length ? `<div class="row"><button class="btn primary" id="all">Review ${waiting.length} remaining</button><span class="meta">Reads each packet once; about three minutes each, several at a time.</span></div>` : ""}
    ${running.length ? `<p class="meta"><span class="spinner"></span>&nbsp; Reviewing ${running.length}…</p>` : ""}
    </div>${table}
    <p class="meta">IHH's real decisions are used only on this screen, after a review is done. The review never sees them. IHH did not record reasons, so a match on the decision does not prove the reasons match. Eleven packets is a small test: a good score here shows the tool isn't broken, not that it is reliable.</p>
    ${denialsHTML(denials)}`;
  const all = $("all");
  if (all) all.onclick = async () => {
    all.disabled = true;
    for (const r of waiting) await api(`/api/review/${r.id}`, { method: "POST" });
    await refresh();
  };
}

function setTab() {
  $("tab-packets").setAttribute("aria-pressed", state.view === "packets");
  $("tab-score").setAttribute("aria-pressed", state.view === "score");
}
$("tab-packets").onclick = () => { if (state.selected) select(state.selected); else { state.view = "packets"; setTab(); renderList(); showWelcome(); } };
$("tab-score").onclick = async () => { state.view = "score"; setTab(); closeViewer(); renderList(); await renderScore(); };

$("file").onchange = async () => {
  const f = $("file").files[0];
  if (!f) return;
  try {
    const p = await api("/api/upload", { method: "POST", body: await f.arrayBuffer(), headers: { "Content-Type": "application/octet-stream" } });
    $("file").value = "";
    await refresh();
    await select(p.id);
  } catch (e) { alert(e.message); }
};

function showWelcome() {
  $("main").innerHTML = `<div class="empty"><h2>Choose a referral packet</h2>
    <p class="acro"><b>F</b>inds the <b>E</b>vidence · <b>T</b>races it to the page · <b>C</b>hecks it twice · <b>H</b>ands it to you</p>
    <p>Pick one of IHH's eleven packets on the left, or open a new fax as a PDF or a photo. The review shows which of IHH's rules the packet meets, which it breaks, and what it doesn't say, each with the page it came from.</p></div>`;
}

showWelcome();
refresh();
</script>
</body>
</html>
