<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fetch</title>
<style>
:root {
  --bg: #f5f5f7; --panel: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --line: #e3e3e8;
  --accent: #0a66d8; --accent-press: #0852ad; --accent-soft: #e8f1fc;
  --red: #c4291c; --red-soft: #fdeceb; --amber: #a35a00; --amber-soft: #fdf3e3;
  --green: #1f7a3a; --green-soft: #e9f6ed; --purple: #6b3fb5; --purple-soft: #f1ecfa;
  --row: #fafafc; --mark: #ffe58a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161618; --panel: #1f1f22; --text: #f2f2f5; --muted: #a1a1a8; --line: #333338;
    --accent: #4a9bff; --accent-press: #2f86f0; --accent-soft: #1c2b40;
    --red: #ff6b5e; --red-soft: #3a1f1d; --amber: #f0a542; --amber-soft: #382a17;
    --green: #5fd27f; --green-soft: #18301f; --purple: #b69cff; --purple-soft: #2a2238;
    --row: #242428; --mark: #6b5a12;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; }
button { font: inherit; }
header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; position: sticky; top: 0; z-index: 5; color: #fff;
  background: radial-gradient(600px 200px at 85% 0%, rgba(127,182,255,.3), transparent 70%), linear-gradient(120deg, #071d3d, #0a5cc4); box-shadow: 0 4px 20px rgba(7,29,61,.25); }
header .sub { color: rgba(255,255,255,.75) !important; }
header h1 { font-size: 22px !important; font-weight: 800; letter-spacing: -.02em; }
header .seg { background: rgba(255,255,255,.14); }
header .seg button { color: #fff; }
header .seg button[aria-pressed="true"] { background: #fff; color: #0b2a55; }
header h1 { font-size: 17px; margin: 0; }
header .sub { color: var(--muted); font-size: 13px; }
.homelink { color: inherit; text-decoration: none; }
.seg { margin-left: auto; display: flex; background: var(--bg); border-radius: 9px; padding: 2px; }
.seg button { border: 0; background: transparent; color: var(--text); padding: 8px 16px; min-height: 44px; border-radius: 7px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 600; }
.layout { display: grid; grid-template-columns: 250px 1fr; min-height: calc(100vh - 61px); }
nav { border-right: 1px solid var(--line); background: var(--panel); padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
nav .item { display: block; width: 100%; text-align: left; border: 0; background: transparent; color: var(--text); padding: 9px 12px; border-radius: 8px; cursor: pointer; min-height: 44px; }
nav .item:hover { background: var(--bg); }
nav .item:active { background: var(--line); }
nav .item[aria-current="true"] { background: var(--accent-soft); }
nav .item b { font-weight: 600; }
nav .item .st { display: block; font-size: 12.5px; color: var(--muted); }
.navflag { display: inline-block; margin-left: 6px; font-weight: 700; color: #fff; background: var(--purple); border-radius: 999px; padding: 0 7px; font-size: 11.5px; }
nav .open { margin-top: 10px; }
main { padding: 24px 28px 60px; max-width: 980px; width: 100%; }
main.wide { max-width: 1120px; margin: 0 auto; }
.dashboard { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
@media (max-width: 1100px) { .dashboard { grid-template-columns: repeat(3, 1fr); } }
.dash { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; text-align: left; color: var(--text); display: flex; flex-direction: column; gap: 2px; min-height: 92px; }
button.dash { cursor: pointer; } button.dash:active { background: var(--bg); }
.dash .n { font-size: 30px; font-weight: 800; line-height: 1.1; }
.dash .top { display: flex; align-items: center; gap: 10px; }
.ico { width: 30px; height: 30px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; color: var(--muted); }
.dash.approve .ico { color: var(--green); } .dash.deny .ico { color: var(--red); } .dash.beds .ico { color: var(--accent); }
.dash.leanok .n, .dash.leanok .ico, .dash.leanno .n, .dash.leanno .ico { color: var(--amber); }
.dash.leanok .l::after { content: " ↗"; color: var(--green); } .dash.leanno .l::after { content: " ↘"; color: var(--red); } .dash .l { font-size: 13.5px; color: var(--muted); font-weight: 600; }
.dash.approve .n { color: var(--green); } .dash.deny .n { color: var(--red); } .dash.look .n { color: var(--purple); } .dash.beds .n { color: var(--accent); }
.bedsrow { display: flex; gap: 6px; margin-top: 6px; } .bedsrow input { width: 64px; min-height: 44px; border: 1px solid var(--line); border-radius: 8px; padding: 0 8px; font: inherit; background: var(--panel); color: var(--text); }
.btn.small { min-height: 44px; padding: 0 10px; font-size: 14px; }
.tiny { font-size: 12px; } .dash-note { margin: 8px 0 18px; }
.qhead { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; } .qhead h2 { margin: 0; font-size: 20px; }
.dropline { border: 2px dashed var(--line); border-radius: 12px; padding: 10px; text-align: center; color: var(--muted); font-size: 14px; margin: 10px 0; }
.dropline.over { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
table.queue td { vertical-align: top; } .qrow { cursor: pointer; } .qrow:hover { background: var(--accent-soft) !important; } .qrow:focus { outline: 2px solid var(--accent); }
.qline { max-width: 380px; } .late { color: var(--red); font-weight: 600; }
.chip2 { font-size: 13px; font-weight: 700; border-radius: 999px; padding: 3px 10px; display: inline-block; white-space: nowrap; }
.chip2.approve { color: var(--green); background: var(--green-soft); } .chip2.deny { color: var(--red); background: var(--red-soft); } .chip2.wait { color: var(--muted); background: var(--bg); }
.riskn { background: var(--purple); color: #fff; font-weight: 700; border-radius: 999px; padding: 2px 10px; }
.backlink { border: 0; background: none; color: var(--accent); font-size: 16px; min-height: 44px; padding: 0; cursor: pointer; }
.decbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; margin-bottom: 14px; }
.decbar.decided.approve { background: var(--green-soft); color: var(--green); } .decbar.decided.deny { background: var(--red-soft); color: var(--red); }
.decbtns { display: flex; gap: 8px; } .btn.approve { color: var(--green); border-color: var(--green); font-weight: 700; } .btn.deny { color: var(--red); border-color: var(--red); font-weight: 700; }
.profile { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 18px; }
.ph { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
.avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 800; font-size: 20px; display: flex; align-items: center; justify-content: center; flex: none; }
.profile .label { font-size: 12.5px; color: var(--muted); } .oneline { font-size: 18px; font-weight: 600; }
.psections { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.psec h4 { margin: 0 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.fact { display: grid; grid-template-columns: 110px 1fr auto; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); align-items: start; font-size: 14.5px; }
.fl { color: var(--muted); } .fv.missing { color: var(--muted); font-style: italic; } 
.taskbar { display: flex; gap: 10px; align-items: center; justify-content: flex-end; flex-wrap: wrap; margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); }
.taskbar select { min-height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; padding: 0 8px; margin-left: 6px; }
.tick2 { min-height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 0 12px; font-weight: 600; cursor: pointer; }
.tick2.on { background: var(--green); border-color: var(--green); color: #fff; }
.taskbar { flex-wrap: wrap; } .tb-left { flex: 1; } .tb-right { display: flex; gap: 8px; align-items: center; }
.taskbar.resolved { justify-content: space-between; } .taskbar .res { flex: 1; color: var(--green); }
.resolve-form { flex-basis: 100%; margin-top: 8px; }
.outcomes { display: flex; gap: 8px; flex-wrap: wrap; }
.outc { min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text); padding: 0 14px; font: inherit; font-weight: 600; cursor: pointer; }
.outc[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.rf-row { display: flex; gap: 10px; align-items: flex-end; margin-top: 8px; flex-wrap: wrap; }
.rf-row label { display: flex; flex-direction: column; font-size: 12.5px; color: var(--muted); gap: 2px; } .rf-row label.grow { flex: 1; min-width: 220px; }
.rf-row input { min-height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; font: inherit; background: var(--panel); color: var(--text); }
.rf-by { width: 100px; } .rf-msg { color: var(--red); margin-top: 4px; }
.roles { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.rolebtn { min-height: 44px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--text); padding: 0 16px; font: inherit; font-weight: 600; cursor: pointer; }
.rolebtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; } .rolebtn[aria-pressed="true"] .count { color: #fff; }
.tgroup { margin-top: 18px; } .tg-head { display: flex; gap: 10px; align-items: baseline; margin-bottom: 6px; } .tg-head .linkbtn { margin-left: 0; font-size: 16px; }
.task .head .pagebtn { margin-left: auto; }
.task.done .head strong { text-decoration: line-through; color: var(--muted); }
.task { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--purple); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
.task.problem { border-left-color: var(--red); } .task .head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.linkbtn { margin-left: auto; border: 0; background: none; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; min-height: 44px; }
.tag.unchecked { color: var(--red); background: var(--red-soft); }
.chip2.info { color: var(--amber); background: var(--amber-soft); }
.matchcell { font-weight: 700; white-space: nowrap; } .red { color: var(--red); } .green { color: var(--green); }
.decfields { display: flex; gap: 12px; align-items: flex-end; flex: 1; flex-wrap: wrap; }
.decfields label { display: flex; flex-direction: column; font-size: 12.5px; color: var(--muted); gap: 2px; }
.decfields label.grow { flex: 1; min-width: 220px; }
.decfields input { min-height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; font: inherit; font-size: 15px; background: var(--panel); color: var(--text); }
#dec-by { width: 110px; }
a.btn { display: inline-flex; align-items: center; text-decoration: none; }
.notice { background: var(--green-soft); color: var(--green); border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; font-weight: 600; }
.notice a { color: inherit; }
.progress { display: flex; gap: 12px; align-items: center; margin-top: 12px; font-size: 14px; }
.pbar2 { width: 220px; height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; flex: none; }
.pbar2 i { display: block; height: 100%; background: var(--green); }
.card.clear { text-align: center; padding: 28px; }
.dash.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.filterbar { margin: 10px 0 0; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.filterbar .linkbtn { margin-left: 0; }
.overdue { color: var(--red); font-weight: 600; margin: 10px 0 0; }
.client { font-size: 17px; font-weight: 600; margin-bottom: 10px; }
details.profile { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 4px 18px; margin: 0 0 18px; }
details.profile > summary { list-style: none; cursor: pointer; min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--text); }
details.profile > summary::-webkit-details-marker { display: none; }
details.profile[open] { padding-bottom: 16px; }
details.profile .showwhy { color: var(--accent); font-weight: 600; white-space: nowrap; }
details.profile[open] .showwhy::after { content: "Hide"; } details.profile:not([open]) .showwhy::after { content: "Show"; }
.decbar.sticky { position: sticky; bottom: 12px; z-index: 4; box-shadow: 0 6px 24px rgba(0,0,0,.12); margin-top: 18px; }
@media (max-width: 900px) { .dashboard { grid-template-columns: repeat(2, 1fr); } .fact { grid-template-columns: 90px 1fr auto; } table.queue th:nth-child(3), table.queue td:nth-child(3) { display: none; } }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 0 16px; min-height: 44px; border-radius: 10px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn:active { background: var(--bg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:active { background: var(--accent-press); }
.btn:disabled { opacity: .5; cursor: default; }
.empty { text-align: center; padding: 70px 20px; color: var(--muted); }
.empty h2 { color: var(--text); font-size: 22px; margin: 0 0 8px; }
.empty p { max-width: 460px; margin: 0 auto 20px; }
.drop { border: 2px dashed #b9c6d8; border-radius: 18px; background: var(--panel); padding: 44px 20px; text-align: center; margin-top: 20px; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop h2 { margin: 0 0 6px; font-size: 22px; } .drop p { color: var(--muted); margin: 0 0 18px; }
.steps { background: var(--panel); border-radius: 18px; padding: 24px; border: 1px solid var(--line); }
.pstep { display: flex; gap: 14px; align-items: center; padding: 9px 0; font-size: 17px; }
.dot { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #fff; flex: none; }
.dot.done { background: var(--green); } .dot.now { background: var(--accent); } .dot.next { background: var(--line); color: var(--muted); }
.pbar { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; margin: 0 0 6px 42px; }
.pbar i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
.steps.fetching { display: grid; grid-template-columns: 150px 1fr; gap: 28px; align-items: center; }
@media (max-width: 640px) { .steps.fetching { grid-template-columns: 1fr; } }
.mini-fax { width: 140px; height: 180px; background: #fbfbf7; border-radius: 6px; box-shadow: 0 14px 30px rgba(0,0,0,.18); padding: 16px 14px; position: relative; overflow: hidden; transform: rotate(-2deg); }
.mini-fax i { display: block; height: 6px; border-radius: 3px; background: #c9ccd3; margin: 9px 0; }
.mini-fax i:nth-child(3n) { width: 70%; } .mini-fax i:nth-child(4) { background: #111; width: 45%; }
.mini-scan { position: absolute; left: 0; right: 0; height: 36px; top: -36px; background: linear-gradient(180deg, transparent, rgba(10,102,216,.2) 70%, rgba(10,102,216,.6)); border-bottom: 2px solid #0a66d8; animation: miniscan 2.2s ease-in-out infinite; }
@keyframes miniscan { 0% { top: -36px; } 90%, 100% { top: 180px; } }
@media (prefers-reduced-motion: reduce) { .mini-scan { animation: none; display: none; } }
.todo { padding: 4px 16px; }
.todo-item { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
.todo-item:first-child { border-top: 0; }
.todo-item .txt { flex: 1; } .todo-item .tt { font-weight: 600; }
.todo-item.done .tt { text-decoration: line-through; color: var(--muted); }
.tick { width: 44px; height: 44px; flex: none; border-radius: 10px; border: 2px solid var(--line); background: var(--panel); color: #fff; font-weight: 800; font-size: 18px; margin: -6px 0; }
.tick:active { background: var(--bg); }
.todo-item.done .tick { background: var(--green); border-color: var(--green); }
.acro { color: var(--text); letter-spacing: .01em; }
.acro b { color: var(--accent); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-bottom: 18px; }
.verdict { display: flex; gap: 18px; align-items: flex-start; }
.verdict .label { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.verdict .call { font-size: 26px; font-weight: 700; margin: 2px 0 6px; }
.call.approve, .call.approve_once_arranged { color: var(--green); } .call.deny { color: var(--red); } .call.need_more_info { color: var(--amber); }
.meta { color: var(--muted); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.banner { border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; background: var(--red-soft); color: var(--red); font-weight: 600; }
h3 { font-size: 15px; margin: 26px 0 10px; display: flex; align-items: center; gap: 8px; }
h3 .count { color: var(--muted); font-weight: 400; }
.finding { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
.finding.problem { border-left-color: var(--red); } .finding.cant_tell { border-left-color: var(--amber); }
.finding.missing { border-left-color: var(--amber); } .finding.ok { border-left-color: var(--green); }
.finding.conflict, .finding.coordinator_call { border-left-color: var(--purple); }
.imgcheck { font-size: 12px; margin-top: 2px; }
.imgcheck.yes { color: var(--green); } .imgcheck.no { color: var(--red); font-weight: 600; } .imgcheck.unclear { color: var(--amber); }
.formonly { font-size: 12.5px; color: var(--amber); margin-top: 6px; font-weight: 600; }
.groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.group { border: 1px solid var(--line); border-radius: 10px; background: var(--row); }
.group > summary { list-style: none; cursor: pointer; padding: 10px 12px; min-height: 44px; border-radius: 10px; }
.group > summary::-webkit-details-marker { display: none; }
.group > summary:hover { background: var(--bg); }
.group[open] { grid-column: 1 / -1; background: var(--panel); }
.group-body { padding: 0 12px 10px; }
.rulerow { border-top: 1px solid var(--line); }
.rulerow > summary { list-style: none; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; padding: 10px 2px; min-height: 44px; }
.rulerow > summary::-webkit-details-marker { display: none; }
.rulerow > summary, .group > summary { color: var(--text); }
.rulerow > summary:hover { background: var(--row); }
.group[open] .showwhy::after { content: "Hide"; } .group:not([open]) .showwhy::after { content: "Show why"; }
.rulerow .rr-text strong::after { content: " ›"; color: var(--muted); font-weight: 400; } .rulerow[open] .rr-text strong::after { content: " ⌄"; }
.rr-text { flex: 1; } .rr-why { display: block; color: var(--muted); font-size: 13.5px; }
.rr-body { padding: 0 2px 10px 72px; }
.pill { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; white-space: nowrap; min-width: 62px; text-align: center; }
.pill.pass { color: var(--green); background: var(--green-soft); } .pill.fail { color: var(--red); background: var(--red-soft); }
.pill.cant { color: var(--amber); background: var(--amber-soft); }
.pill.arrange, .tag.arrange { color: var(--accent); background: var(--accent-soft); }
.r.arrange { color: var(--accent); } .pill.judge { color: var(--purple); background: var(--purple-soft); }
.flagged { background: var(--purple-soft); border: 2px solid var(--purple); border-radius: 16px; padding: 16px; margin: 0 0 18px; }
.flagged-head { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
.flagged-head h2 { margin: 0; font-size: 19px; }
.flag-count { background: var(--purple); color: #fff; font-weight: 700; font-size: 20px; min-width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; }
.flagbadge { color: #fff; background: var(--purple); }
@media (max-width: 760px) { .rr-body { padding-left: 2px; } }
.group .g { font-size: 13px; color: var(--muted); }
.group .r { font-weight: 700; }
.r.pass { color: var(--green); } .r.fail { color: var(--red); } .r.cant { color: var(--amber); } .r.judge { color: var(--purple); }
.quote .side { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; max-width: 200px; text-align: right; }
.badge { font-size: 12.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; display: inline-block; }
.badge.ok { color: var(--green); background: var(--green-soft); }
.badge.bad { color: var(--red); background: var(--red-soft); }
.badge-why { font-size: 12px; color: var(--red); }
.trust { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.tag { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; }
.tag.problem { color: var(--red); background: var(--red-soft); }
.tag.coordinator_call, .tag.conflict { color: var(--purple); background: var(--purple-soft); }
details.fold { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px 14px; margin-bottom: 8px; }
details.fold > summary { color: var(--text); font-weight: 600; min-height: 44px; display: flex; align-items: center; gap: 8px; }
details.fold[open] { padding-bottom: 10px; }
.call .lean { font-weight: 500; }
.finding .head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.finding .head strong { font-weight: 600; }
.finding .rule { font-size: 12.5px; color: var(--muted); }
.finding .expl { margin: 4px 0 0; }
.finding .ruletext { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.unsupported { font-size: 12.5px; color: var(--red); margin-top: 6px; font-weight: 600; }
.quote { display: flex; gap: 10px; align-items: flex-start; margin-top: 8px; padding: 8px 10px; background: var(--row); border-radius: 8px; }
.quote q { flex: 1; font-style: italic; }
.pagebtn { border: 1px solid var(--line); background: var(--panel); color: var(--accent); border-radius: 8px; min-height: 44px; min-width: 52px; padding: 0 8px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.pagebtn:active { background: var(--accent-soft); }
.check { font-size: 12px; white-space: nowrap; padding-top: 6px; }
.check.on_page, .check.close { color: var(--green); }
.check.other_page { color: var(--amber); } .check.not_found { color: var(--red); font-weight: 600; }
details > summary { cursor: pointer; color: var(--accent); min-height: 32px; padding-top: 4px; }
ul.ask { margin: 0; padding-left: 20px; }
textarea { width: 100%; min-height: 150px; border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: inherit; background: var(--panel); color: var(--text); resize: vertical; }
.row { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.viewer { position: fixed; top: 61px; right: 0; bottom: 0; width: min(560px, 48vw); background: var(--panel); border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0,0,0,.08); display: flex; flex-direction: column; z-index: 10; }
.viewer[hidden] { display: none; }
.viewer .bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.viewer .bar .t { flex: 1; font-weight: 600; }
.viewer .body { overflow: auto; padding: 14px; }
.viewer img { width: 100%; border: 1px solid var(--line); border-radius: 6px; background: #fff; display: block; }
.pagewrap { position: relative; }
.hl { position: absolute; border: 3px solid var(--accent); background: rgba(10, 102, 216, .14); border-radius: 4px; pointer-events: none; }
.hl[hidden] { display: none; }
.viewer pre { white-space: pre-wrap; font: 13px/1.5 ui-monospace, Menlo, monospace; background: var(--row); padding: 12px; border-radius: 8px; }
mark { background: var(--mark); color: inherit; }
table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 12px; overflow: hidden; }
th, td { text-align: left; padding: 10px 12px; font-size: 14px; }
th { font-size: 12.5px; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); }
tbody tr:nth-child(even) { background: var(--row); }
.big { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
.spinner { width: 22px; height: 22px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  nav { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  nav .item { width: auto; min-width: 120px; }
  main { padding: 16px; }
  .viewer { width: 100vw; }
}
</style>
</head>
<body>
<header>
  <div>
    <h1><a href="/" class="homelink" title="About Fetch">Fetch</a></h1>
    <div class="sub">Referral review for Illumination Health + Home</div>
  </div>
  <div class="seg" role="group" aria-label="View">
    <button id="tab-queue" aria-pressed="true">Queue</button>
    <button id="tab-tasks" aria-pressed="false">Tasks</button>
    <button id="tab-score" aria-pressed="false">Score</button>
  </div>
</header>
<main id="main" class="wide"></main>
<aside class="viewer" id="viewer" hidden aria-label="Page viewer">
  <div class="bar">
    <button class="btn" id="v-prev" aria-label="Previous page">‹</button>
    <span class="t" id="v-title"></span>
    <button class="btn" id="v-next" aria-label="Next page">›</button>
    <button class="btn" id="v-close">Close</button>
  </div>
  <div class="body">
    <div id="v-note" class="meta"></div>
    <div class="pagewrap"><img id="v-img" alt=""><div class="hl" id="v-hl" hidden></div></div>
    <details id="v-tr-wrap"><summary>Show what Claude read on this page</summary><pre id="v-tr"></pre></details>
  </div>
</aside>
<input type="file" id="file" accept="application/pdf,image/jpeg,image/png,image/heic,.heic" hidden>
<script>
const state = { view: "queue", selected: null, packets: [], desk: null, review: null, profile: null, viewer: null };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const CALL = { approve: "Approve", approve_once_arranged: "Approve once arranged", deny: "Deny", need_more_info: "Needs more information" };
const CHECK = {
  on_page: "✓ On the page",
  close: "≈ On the page, small reading differences",
  other_page: (e) => `! Found on page ${e.found_on}, not ${e.page}`,
  not_found: "✗ Not found on the page. Check by hand",
};

async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || `Request failed (${r.status})`);
  return body;
}

function statusLine(p) {
  if (p.state === "running") return esc(p.step || "Reviewing");
  if (p.state === "error") return "Stopped. Open for details";
  if (p.state === "done") return `Fetch suggests: ${suggestionText(p.decision, p.lean).toLowerCase()}${p.flagged ? `<span class="navflag">${p.flagged} flagged</span>` : ""}`;
  if (p.state === "changed") return "File changed. Review hidden";
  return "Not reviewed";
}

function packetName(p) { return p.uploaded ? `Opened packet ${p.id.slice(1)}` : `Packet ${p.id}`; }
function ago(seconds) {
  const m = Math.max(0, Math.round(seconds / 60));
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`;
}
function clock(t) { return new Date(t * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
function leanOf(p) { return ["approve", "approve_once_arranged"].includes(p.decision) ? "approve" : p.decision === "deny" ? "deny" : p.lean; }

async function refresh() {
  state.desk = await api("/api/queue");
  state.packets = state.desk.rows;
  if (state.view === "queue") renderQueue();
  if (state.view === "tasks") renderTasks();
  if (state.view === "packet" && state.selected) {
    const p = state.packets.find((x) => x.id === state.selected);
    if (p && (p.state !== "done" || !state.review || state.review.packet_id !== p.id)) await renderPacket();
  }
  if (state.view === "score") await renderScore(true);
  const running = state.packets.some((p) => p.state === "running");
  clearTimeout(state.timer);
  if (running) state.timer = setTimeout(refresh, 2000);
}

// ---------- dashboard
const ICON = {
  all: '<path d="M4 13l2.5-7h11L20 13v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M4 13h5l1 2h4l1-2h5"/>',
  approve: '<circle cx="12" cy="12" r="8.5"/><path d="M8 12.5l2.8 2.8L16.5 9.5"/>',
  deny: '<circle cx="12" cy="12" r="8.5"/><path d="M9 9l6 6M15 9l-6 6"/>',
  leanapprove: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5l3 2"/><path d="M15.5 4.5l2 2"/>',
  leandeny: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5l3 2"/><path d="M15.5 4.5l2 2"/>',
  beds: '<path d="M3 18V7M3 14h18v4M21 14v-2.5a2.5 2.5 0 0 0-2.5-2.5H11v5"/><circle cx="7" cy="11" r="1.8"/>',
};
const icon = (k) => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;
function dashboardHTML() {
  const c = state.desk.counts, beds = state.desk.beds;
  const tile = (n, label, cls, go) => `<button class="dash ${cls}${state.filter === go || (go === "all" && !state.filter && state.view === "queue") ? " on" : ""}" ${go ? `data-go="${go}" aria-pressed="${state.filter === go}"` : "disabled"}><span class="top">${icon(go)}<span class="n">${n}</span></span><span class="l">${label}</span></button>`;
  return `<div class="dashboard">
    ${tile(c.to_review, "To review", "", "all")}
    ${tile(c.suggest_approve, "Approve", "approve", "approve")}
    ${tile(c.suggest_deny, "Deny", "deny", "deny")}
    ${tile(c.lean_approve, "Needs info, leaning approve", "leanok", "leanapprove")}
    ${tile(c.lean_deny, "Needs info, leaning deny", "leanno", "leandeny")}
    <div class="dash beds"><span class="top">${icon("beds")}<span class="n" id="beds-n">${beds ? beds.count : "–"}</span></span><span class="l">Beds available</span>
      <span class="bedsrow"><input id="beds-in" type="number" min="0" max="500" inputmode="numeric" aria-label="Beds available" value="${beds ? beds.count : ""}"><button class="btn small" id="beds-save">Update</button></span>
      <span class="meta tiny">${beds ? `Entered at ${clock(beds.at)}` : "Not entered yet"}</span></div>
  </div>
  <div class="progress"><div class="pbar2"><i style="width:${c.total ? Math.round(100 * c.decided / c.total) : 0}%"></i></div>
    <span><b>${c.decided} of ${c.total} decided</b> · ${c.approved} approved, ${c.denied} denied${c.median_seconds ? ` · median ${ago(c.median_seconds)} from opening to decision` : ""}</span></div>
  <p class="meta dash-note">Approve, Deny and the two leanings are what Fetch suggests. None is a decision until a person records one.</p>`;
}
function wireDashboard() {
  document.querySelectorAll(".dash[data-go]").forEach((b) => b.onclick = () => { state.filter = b.dataset.go === "all" ? null : b.dataset.go; showQueue(); });
  $("beds-save").onclick = async () => {
    const v = $("beds-in").value.trim();
    try { await api("/api/beds", { method: "POST", body: JSON.stringify({ count: v === "" ? null : Number(v) }) }); await refresh(); }
    catch (e) { alert(e.message); }
  };
}

// ---------- queue
function suggestionChip(p) {
  if (p.state === "running") return `<span class="chip2 wait">Reading…</span>`;
  if (p.state === "new") return `<span class="chip2 wait">Not fetched</span>`;
  if (p.state === "error") return `<span class="chip2 deny">Stopped</span>`;
  if (p.state === "changed") return `<span class="chip2 deny">File changed</span>`;
  const cls = p.decision === "need_more_info" ? "info" : leanOf(p);
  const text = p.decision === "need_more_info" ? `Needs info, leaning ${p.lean}` : CALL[p.decision];
  return `<span class="chip2 ${cls}">${esc(text)}</span>`;
}
function renderQueue() {
  const now = state.desk.now;
  const FILTERS = { approve: ["Fetch suggests approve", (p) => p.state === "done" && ["approve", "approve_once_arranged"].includes(p.decision)],
    deny: ["Fetch suggests deny", (p) => p.state === "done" && p.decision === "deny"],
    leanapprove: ["Needs info, leaning approve", (p) => p.state === "done" && p.decision === "need_more_info" && p.lean === "approve"],
    leandeny: ["Needs info, leaning deny", (p) => p.state === "done" && p.decision === "need_more_info" && p.lean === "deny"],
    look: ["To look at (open risks)", (p) => (p.open_tasks || 0) > 0] };
  const filt = FILTERS[state.filter];
  const open = state.packets.filter((p) => !p.coordinator && (!filt || filt[1](p))).sort((a, b) => a.added_at - b.added_at || a.id.localeCompare(b.id));
  const done = state.packets.filter((p) => p.coordinator).sort((a, b) => b.coordinator.at - a.coordinator.at);
  const row = (p) => {
    const waited = now - p.added_at;
    const dec = p.coordinator ? `<span class="chip2 ${p.coordinator.decision}">${p.coordinator.decision === "approve" ? "Approved" : "Denied"}</span><div class="meta tiny">${esc(p.coordinator.by || "")} at ${clock(p.coordinator.at)}${p.coordinator.seconds_to_decide ? ` · ${ago(p.coordinator.seconds_to_decide)}` : ""}</div><a class="tiny" href="/api/export/${p.id}.pdf" download onclick="event.stopPropagation()">PDF</a>` : `<span class="meta">To review</span>`;
    return `<tr class="qrow" data-id="${p.id}" tabindex="0">
      <td><b>${esc(packetName(p))}</b><div class="meta qline">${esc(p.profile_line || (p.state === "running" ? p.step : "") || "")}</div></td>
      <td>${p.coordinator ? "–" : ago(waited)}</td>
      <td>${p.scan_seconds ? `${Math.floor(p.scan_seconds / 60)} min ${String(p.scan_seconds % 60).padStart(2, "0")} s` : p.state === "done" ? '<span class="meta">Not timed</span>' : "–"}${p.pages ? `<div class="meta tiny">${p.pages} pages</div>` : ""}</td>
      <td>${suggestionChip(p)}</td>
      <td>${p.open_tasks ? `<span class="riskn">${p.open_tasks}</span>` : p.state === "done" ? `<span class="meta">None open</span>` : ""}</td>
      <td>${dec}</td></tr>`;
  };
  const table = (rows) => `<table class="queue"><thead><tr><th>Referral</th><th title="Since the referral was added to Fetch. The fax's own time is blacked out.">Waiting</th><th title="A fresh, full scan of this referral: every page read, every rule checked, every quote checked twice, client profile built.">Time to scan</th><th>Fetch suggests</th><th>Open risks</th><th>Decision</th></tr></thead><tbody>${rows.map(row).join("")}</tbody></table>`;
  $("main").innerHTML = `${dashboardHTML()}
    <div class="qhead"><h2>${filt ? esc(filt[0]) : "Queue"} <span class="count">${open.length}</span></h2><button class="btn" id="add">Add a referral…</button></div>
    ${filt ? `<div class="filterbar">Showing ${esc(filt[0].toLowerCase())} only. <button class="linkbtn" id="clearf">Show all referrals</button></div>` : ""}
    ${overdueNote(open, now)}
    <div class="dropline" id="drop">Drop a fax PDF or photo anywhere here to add it to the queue.</div>
    ${open.length ? table(open) : filt ? `<div class="card meta">No referrals match this filter. <button class="linkbtn" id="clearf2">Show all referrals</button></div>`
      : `<div class="card clear"><p class="big">Queue clear</p><p>All ${done.length} referrals have a decision${state.desk.counts.median_seconds ? `, a median of ${ago(state.desk.counts.median_seconds)} each from opening to decision` : ""}.${state.desk.beds ? ` Beds available: ${state.desk.beds.count}.` : ""}</p><p class="meta">New referrals appear here when you add them. Each decided referral below has its PDF record.</p></div>`}
    ${done.length ? `<h3>Decided <span class="count">${done.length}</span></h3>${table(done)}` : ""}
    <p class="meta">"Waiting" counts from when the referral was added to Fetch; the fax's own date and time are blacked out. "Time to scan" is a fresh, full scan of the referral: every page read, every rule checked, every quote checked twice, client profile built.</p>`;
  wireDashboard();
  if ($("clearf")) $("clearf").onclick = () => { state.filter = null; showQueue(); };
  if ($("clearf2")) $("clearf2").onclick = () => { state.filter = null; showQueue(); };
  $("add").onclick = () => $("file").click();
  document.querySelectorAll(".qrow").forEach((r) => { r.onclick = () => select(r.dataset.id); r.onkeydown = (e) => { if (e.key === "Enter") select(r.dataset.id); }; });
  const drop = $("main");
  const strip = (on) => { const d = $("drop"); if (d) d.classList.toggle("over", on); };   // the strip only exists on the queue
  drop.ondragover = (e) => { e.preventDefault(); strip(true); };
  drop.ondragleave = () => strip(false);
  drop.ondrop = (e) => { e.preventDefault(); strip(false); if (e.dataTransfer.files[0]) uploadFile(e.dataTransfer.files[0]); };
}

function overdueNote(open, now) {
  const late = open.filter((p) => now - p.added_at > 7200);
  if (!late.length) return "";
  const times = [...new Set(late.map((p) => clock(p.added_at)))];
  return `<p class="overdue">${late.length} of ${open.length} waiting longer than IHH's 2-hour target${times.length === 1 ? ` (all added at ${times[0]})` : ""}.</p>`;
}

// ---------- tasks
function taskControls(t) {
  if (!t) return "";
  const owners = state.desk.owners.map((o) => `<option ${o === t.owner ? "selected" : ""}>${esc(o)}</option>`).join("");
  const who = `<label class="meta">Who reviews <select class="owner" data-task="${esc(t.id)}">${owners}</select></label>`;
  if (t.done) {
    return `<div class="taskbar resolved"><span class="res"><b>✓ ${esc(t.outcome_label || "Done")}</b> · ${esc(t.note || "")} <span class="meta">· ${esc(t.by || "")} at ${t.done_at ? clock(t.done_at) : ""}</span></span>
      <span class="tb-right">${who}<button class="btn small reopen" data-task="${esc(t.id)}">Reopen</button></span></div>`;
  }
  return `<div class="taskbar" data-form="${esc(t.id)}">
    <span class="tb-left">${who}</span>
    <span class="tb-right"><button class="btn small resolve-open" data-task="${esc(t.id)}">Resolve…</button></span>
    <div class="resolve-form" hidden>
      <div class="outcomes" role="radiogroup" aria-label="Outcome">${t.outcomes.map(([k, label]) => `<button class="outc" role="radio" aria-checked="false" data-outcome="${k}">${esc(label)}</button>`).join("")}</div>
      <div class="rf-row"><label class="grow">Why <input class="rf-note" maxlength="500" placeholder="What you found or did, for the record"></label>
        <label>Initials <input class="rf-by" maxlength="40" value="${esc(savedInitials())}"></label>
        <button class="btn primary small rf-save">Save</button><button class="btn small rf-cancel">Cancel</button></div>
      <div class="meta rf-msg" role="status"></div>
    </div>
  </div>`;
}
function wireTasks(root) {
  const after = async () => { state.review = null; await refresh(); if (state.view === "packet") { const y = window.scrollY; await renderPacket(); window.scrollTo(0, y); } };
  root.querySelectorAll("select.owner").forEach((s) => s.onchange = async (e) => {
    e.stopPropagation();
    await api("/api/task", { method: "POST", body: JSON.stringify({ id: s.dataset.task, owner: s.value }) });
    await after();
  });
  root.querySelectorAll(".reopen").forEach((b) => b.onclick = async () => {
    await api("/api/task", { method: "POST", body: JSON.stringify({ id: b.dataset.task, reopen: true }) });
    await after();
  });
  root.querySelectorAll(".resolve-open").forEach((b) => b.onclick = () => {
    const bar = b.closest(".taskbar"); bar.querySelector(".resolve-form").hidden = false; b.hidden = true;
  });
  root.querySelectorAll(".taskbar[data-form]").forEach((bar) => {
    let pick = null;
    bar.querySelectorAll(".outc").forEach((o) => o.onclick = () => {
      pick = o.dataset.outcome;
      bar.querySelectorAll(".outc").forEach((x) => x.setAttribute("aria-checked", x === o));
    });
    const cancel = bar.querySelector(".rf-cancel");
    if (cancel) cancel.onclick = () => { bar.querySelector(".resolve-form").hidden = true; bar.querySelector(".resolve-open").hidden = false; };
    const save = bar.querySelector(".rf-save");
    if (save) save.onclick = async () => {
      const msg = bar.querySelector(".rf-msg"), note = bar.querySelector(".rf-note").value.trim(), by = bar.querySelector(".rf-by").value.trim();
      if (!pick) { msg.textContent = "Pick an outcome."; return; }
      if (!note) { msg.textContent = "Write why, so the record explains the outcome."; bar.querySelector(".rf-note").focus(); return; }
      if (!by) { msg.textContent = "Enter your initials."; bar.querySelector(".rf-by").focus(); return; }
      try { localStorage.setItem("fetch-initials", by); } catch {}
      try { await api("/api/task", { method: "POST", body: JSON.stringify({ id: bar.dataset.form, outcome: pick, note, by }) }); }
      catch (e) { msg.textContent = e.message; return; }
      await after();
    };
  });
  root.querySelectorAll("[data-tpage]").forEach((b) => b.onclick = async () => {
    if (!state.review || state.review.packet_id !== b.dataset.pid) state.review = await api(`/api/review/${b.dataset.pid}`);
    openViewer(+b.dataset.tpage, b.dataset.quote, b.dataset.box ? JSON.parse(b.dataset.box) : null);
  });
}

function savedRole() { try { return localStorage.getItem("fetch-role") || "Coordinator"; } catch { return "Coordinator"; } }
function renderTasks() {
  const live = state.desk.tasks.filter((t) => !(state.packets.find((p) => p.id === t.packet_id) || {}).coordinator);
  const role = state.role || savedRole();
  const sev = { problem: 0, coordinator_call: 1, arrange: 2, unchecked: 3, conflict: 4 };
  const mine = live.filter((t) => t.owner === role);
  const open = mine.filter((t) => !t.done).sort((a, b) => a.packet_id.localeCompare(b.packet_id) || sev[a.kind] - sev[b.kind]);
  const done = mine.filter((t) => t.done).sort((a, b) => (b.done_at || 0) - (a.done_at || 0));
  const roles = state.desk.owners.map((o) => {
    const n = live.filter((t) => t.owner === o && !t.done).length;
    return `<button class="rolebtn" aria-pressed="${o === role}" data-role="${esc(o)}">${esc(o)} <span class="count">${n}</span></button>`;
  }).join("");
  const byPacket = {};
  for (const t of open) (byPacket[t.packet_id] ||= []).push(t);
  const pname = (id) => packetName({ id, uploaded: id.startsWith("U") });
  const line = (id) => (state.packets.find((p) => p.id === id) || {}).profile_line || "";
  const ev = (t) => t.evidence ? `<button class="pagebtn" data-tpage="${t.evidence.page}" data-pid="${t.packet_id}" data-quote="${esc(t.evidence.quote)}" data-box="${t.evidence.box ? esc(JSON.stringify(t.evidence.box)) : ""}">p. ${t.evidence.page}</button>` : "";
  const item = (t) => `<div class="task ${t.kind}${t.done ? " done" : ""}">
      <div class="head"><span class="tag ${t.kind}">${esc(t.kind_label)}</span><strong>${esc(t.title)}</strong>${ev(t)}</div>
      <p class="expl">${esc(t.detail)}</p>${taskControls(t)}</div>`;
  const total = mine.length;
  $("main").innerHTML = `${dashboardHTML()}
    <div class="qhead"><h2>My tasks</h2></div>
    <div class="roles" role="group" aria-label="Your role">${roles}</div>
    <div class="progress"><div class="pbar2"><i style="width:${total ? Math.round(100 * done.length / total) : 0}%"></i></div>
      <span><b>${done.length} of ${total} done</b> for ${esc(role)}. Resolve each one with an outcome and why; it goes into the referral's PDF record.</span></div>
    ${open.length ? Object.entries(byPacket).map(([id, ts]) => `<div class="tgroup"><div class="tg-head"><button class="linkbtn" data-open="${id}">${esc(pname(id))} ›</button><span class="meta">${esc(line(id))}</span></div>${ts.map(item).join("")}</div>`).join("")
      : `<div class="card clear"><p class="big">Nothing open for ${esc(role)}</p><p class="meta">${total ? "Everything assigned to you is resolved." : "No tasks are assigned to this role."} Pick another role above, or go back to the queue.</p></div>`}
    ${done.length ? `<details class="fold"><summary>Done <span class="count">${done.length}</span></summary>${done.map(item).join("")}</details>` : ""}`;
  wireDashboard();
  wireTasks($("main"));
  document.querySelectorAll("[data-open]").forEach((b) => b.onclick = () => select(b.dataset.open));
  document.querySelectorAll(".rolebtn").forEach((b) => b.onclick = () => { state.role = b.dataset.role; try { localStorage.setItem("fetch-role", state.role); } catch {} renderTasks(); });
}

async function select(id) {
  state.view = "packet"; state.selected = id; state.review = null; state.profile = null;
  api(`/api/opened/${id}`, { method: "POST" }).catch(() => {});
  setTab();
  closeViewer();
  window.scrollTo(0, 0);
  await renderPacket();
}
function showQueue() { state.view = "queue"; state.selected = null; setTab(); closeViewer(); renderQueue(); window.scrollTo(0, 0); }
function showTasks() { state.view = "tasks"; setTab(); closeViewer(); renderTasks(); window.scrollTo(0, 0); }

async function startReview(id, fresh) {
  await api(`/api/review/${id}${fresh ? "?fresh=1" : ""}`, { method: "POST" });
  state.review = null;
  await refresh();
}

async function renderPacket() {
  const p = state.packets.find((x) => x.id === state.selected);
  const main = $("main");
  if (!p) return;
  const name = packetName(p);
  if (p.state === "new") {
    main.innerHTML = `<div class="empty"><h2>${name} hasn't been fetched</h2>
      <p>Fetch reads every page of the fax and checks it against IHH's admission rules. Each finding shows the page and the words it came from. It takes about three minutes.</p>
      <button class="btn primary" id="go">Fetch</button></div>`;
    $("go").onclick = () => startReview(p.id);
    return;
  }
  if (p.state === "running") {
    main.innerHTML = `<button class="backlink" onclick="showQueue()">‹ Queue</button>` + progressHTML(name, p.step || "");
    return;
  }
  if (p.state === "changed") {
    main.innerHTML = `<div class="empty"><h2>${name} changed after it was reviewed</h2>
      <p>The file no longer matches the one Fetch read, so its review is hidden. Fetch it again to review the file as it is now.</p>
      <button class="btn primary" id="go">Fetch again</button></div>`;
    $("go").onclick = () => startReview(p.id, true);
    return;
  }
  if (p.state === "error") {
    main.innerHTML = `<div class="empty"><h2>The review of ${name} stopped</h2><p>${esc(p.error)}</p>
      <button class="btn primary" id="go">Review again</button></div>`;
    $("go").onclick = () => startReview(p.id, true);
    return;
  }
  if (!state.review || state.review.packet_id !== p.id) state.review = await api(`/api/review/${p.id}`);
  if (!state.profile || state.profile.packet_id !== p.id) state.profile = await api(`/api/profile/${p.id}`).catch(() => null);
  const n = state.notice; state.notice = null;
  const left = state.packets.filter((x) => !x.coordinator).length;
  const notice = n ? `<div class="notice">Recorded: ${esc(packetName({ id: n.id, uploaded: n.id.startsWith("U") }))} ${n.decision === "approve" ? "approved" : "denied"} by ${esc(n.by)}. <a href="/api/export/${n.id}.pdf" download>Export its PDF</a> · ${left} left in the queue.</div>` : "";
  main.innerHTML = `<button class="backlink" id="back">‹ Queue</button>` + notice + reviewHTML(state.review, name, state.profile) + decisionBar(p);
  $("back").onclick = showQueue;
  wireTasks(main);
  main.querySelectorAll("[data-decide]").forEach((b) => b.onclick = async () => {
    const d = b.dataset.decide;
    if (d === "clear") {
      await api(`/api/decision/${p.id}`, { method: "POST", body: JSON.stringify({ decision: null }) });
      await refresh(); return renderPacket();
    }
    const by = $("dec-by").value.trim(), note = $("dec-note").value.trim();
    if (!by) { $("dec-msg").textContent = "Enter your initials so the record shows who decided."; $("dec-by").focus(); return; }
    try { localStorage.setItem("fetch-initials", by); } catch {}
    await api(`/api/decision/${p.id}`, { method: "POST", body: JSON.stringify({ decision: d, by, note }) });
    await refresh();
    state.notice = { id: p.id, decision: d, by };
    const next = nextUndecided(p.id);
    if (next) await select(next.id); else showQueue();
  });
  main.querySelectorAll(".pagebtn").forEach((b) => b.onclick = () => openViewer(+b.dataset.page, b.dataset.quote, b.dataset.box ? JSON.parse(b.dataset.box) : null));
  main.querySelectorAll(".tick").forEach((b) => b.onclick = () => {
    const r = state.review, ticks = loadTicks(r);
    ticks[b.dataset.i] = !ticks[b.dataset.i];
    try { localStorage.setItem(todoKey(r), JSON.stringify(ticks)); } catch {}
    const on = !!ticks[b.dataset.i];
    b.closest(".todo-item").classList.toggle("done", on);
    b.setAttribute("aria-checked", on);
    b.textContent = on ? "✓" : "";
    const all = main.querySelectorAll(".tick").length, done = main.querySelectorAll(".todo-item.done").length;
    const count = b.closest(".todo").previousElementSibling.querySelector(".count");
    if (count) count.textContent = `${done} of ${all} done`;
  });
  const again = $("again");
  if (again) again.onclick = () => startReview(p.id, true);
}

// One badge per quote. "Checked" means it was found in Fetch's reading of the page AND on the page image.
function trust(e) {
  const textOk = e.check === "on_page" || e.check === "close";
  const imageOk = e.image_check === undefined ? null : e.image_check === "yes";
  if (textOk && imageOk) return "";
  if (textOk && imageOk === null) return `<span class="badge ok" title="Found in the page text; not yet checked on the image">✓ In the page text</span>`;
  let why = "Not found on this page";
  if (e.check === "other_page") why = `It's on page ${e.found_on}, not ${e.page}`;
  else if (textOk && e.image_check === "unclear") why = "Hard to read on the page image";
  else if (textOk) why = "Not seen on the page image";
  const says = e.image_says ? `<div class="badge-why">Page shows: ${esc(e.image_says)}</div>` : "";
  return `<span class="badge bad">Check by hand</span><div class="badge-why">${why}</div>${says}`;
}
function quoteHTML(e) {
  return `<div class="quote">
    <button class="pagebtn" data-page="${e.page}" data-quote="${esc(e.quote)}" data-box="${e.box ? esc(JSON.stringify(e.box)) : ""}" aria-label="Open page ${e.page}">p. ${e.page}</button>
    <q>${esc(e.quote)}</q>
    <span class="side">${trust(e)}</span></div>`;
}

const TAG = { problem: "Rules them out", arrange: "Arrange first", coordinator_call: "Your call", conflict: "Pages disagree" };
function taskFor(pid, f) {
  if (!state.desk) return null;
  const rv = state.review.review;
  let key;
  if (!f.status) key = `conflict:${rv.conflicts.indexOf(f)}`;
  else if (["problem", "coordinator_call", "arrange"].includes(f.status)) key = `${f.status}:${f.rule_id}`;
  else key = `unchecked:${f.rule_id}`;
  return state.desk.tasks.find((t) => t.id === `${pid}:${key}`) || null;
}
function findingHTML(f, task) {
  const kind = f.status || "conflict";
  const tag = TAG[kind] ? `<span class="tag ${kind}">${TAG[kind]}</span>` : "";
  const rule = f.rule_id ? `<span class="rule">${esc(f.rule_id)}${f.known_rule ? "" : " (not an IHH rule ID)"}</span>` : "";
  return `<div class="finding ${kind}">
    <div class="head">${tag}<strong>${esc(f.headline || f.topic)}</strong>${rule}</div>
    <p class="expl">${esc(f.explanation)}</p>
    ${f.rule_text ? `<div class="ruletext">IHH rule: ${esc(f.rule_text)}</div>` : ""}
    ${f.form_only ? `<div class="formonly">Only the referral form says this. The chart doesn't confirm it.</div>` : ""}
    ${f.guard ? `<div class="formonly">Changed from ${f.guard.was === "ok" ? "pass" : "fail"} to can't tell by Fetch's timing check. ${esc(f.guard.reason)}</div>` : ""}
    ${f.supported === false ? `<div class="unsupported">None of its quotes checked out. Treat this finding as unchecked.</div>` : ""}
    ${f.evidence.map(quoteHTML).join("")}
    ${task ? taskControls(task) : ""}
  </div>`;
}

function folded(title, items) {
  if (!items.length) return "";
  return `<details class="fold"><summary>${title} <span class="count">${items.length}</span></summary>${items.map(findingHTML).join("")}</details>`;
}

const GROUPS = [["GEN", "General"], ["ADL", "Daily living"], ["MOB", "Mobility"], ["MH", "Mental health"],
  ["COG", "Cognition"], ["OTH", "Other factors"], ["INF", "Infection control"], ["EOL", "End of life"], ["DOC", "Documents"], ["FORM", "Referral form"]];
function groupOf(id) { const pre = id.split("-")[0]; const g = GROUPS.find(([k]) => k === pre); return g ? g[1] : "Conditions"; }
const RESULT = { ok: ["pass", "Pass"], problem: ["fail", "Fail"], arrange: ["arrange", "Arrange first"], coordinator_call: ["judge", "Your call"],
  cant_tell: ["cant", "Can't tell"], missing: ["cant", "Missing"] };
function ruleResult(f) {
  // A pass that rests only on the referral form, or on quotes that didn't check out, isn't shown as a pass.
  if (f.status === "ok" && (f.form_only || f.supported === false)) return ["cant", "Unconfirmed"];
  return RESULT[f.status];
}
function ruleRow(f) {
  const [cls, word] = ruleResult(f);
  return `<details class="rulerow">
    <summary><span class="pill ${cls}">${word}</span><span class="rr-text"><strong>${esc(f.headline)}</strong>
      <span class="rr-why">${esc(f.explanation)}</span></span><span class="rule">${esc(f.rule_id)}</span></summary>
    <div class="rr-body">
      ${f.rule_text ? `<div class="ruletext">IHH rule: ${esc(f.rule_text)}</div>` : ""}
      ${f.form_only ? `<div class="formonly">Only the referral form says this. The chart doesn't confirm it.</div>` : ""}
      ${f.guard ? `<div class="formonly">Changed from ${f.guard.was === "ok" ? "pass" : "fail"} to can't tell: ${esc(f.guard.reason)}</div>` : ""}
      ${f.evidence.length ? f.evidence.map(quoteHTML).join("") : `<div class="meta">No quote: the packet doesn't say.</div>`}
    </div></details>`;
}
function groupsHTML(findings) {
  const order = [...GROUPS.map(([, n]) => n), "Conditions"];
  const groups = {};
  for (const f of findings) (groups[groupOf(f.rule_id)] ||= []).push(f);
  const rank = { fail: 0, judge: 1, arrange: 2, cant: 3, pass: 4 };
  const cells = order.filter((n) => groups[n]).map((n) => {
    const fs = groups[n].slice().sort((a, b) => rank[ruleResult(a)[0]] - rank[ruleResult(b)[0]]);
    const results = fs.map((f) => ruleResult(f)[0]);
    const [cls, word] = results.includes("fail") ? ["fail", "Fail"] : results.includes("judge") ? ["judge", "Your call"]
      : results.includes("arrange") ? ["arrange", "Arrange first"] : results.includes("cant") ? ["cant", "Can't tell"] : ["pass", "Pass"];
    const passed = results.filter((r) => r === "pass").length;
    return `<details class="group ${cls}"><summary><div class="g">${n}</div><div class="r ${cls}">${word}</div>
      <div class="meta">${passed} of ${fs.length} rule${fs.length > 1 ? "s" : ""} pass · <span class="showwhy"></span></div></summary>
      <div class="group-body">${fs.map(ruleRow).join("")}</div></details>`;
  }).join("");
  return `<h3>Rule by rule</h3><div class="groups">${cells}</div>`;
}

function suggestionText(decision, lean) {
  return decision === "need_more_info" ? `${CALL[decision]}, leaning ${lean}` : CALL[decision];
}

function savedInitials() { try { return localStorage.getItem("fetch-initials") || ""; } catch { return ""; } }
function decisionBar(p) {
  const c = p.coordinator;
  const exp = `<a class="btn small" href="/api/export/${p.id}.pdf" download>Export PDF</a>`;
  if (c) {
    const took = c.seconds_to_decide ? ` · decided ${ago(c.seconds_to_decide)} after opening` : "";
    return `<div class="decbar sticky decided ${c.decision}"><span><b>${c.decision === "approve" ? "Approved" : "Denied"}</b> by ${esc(c.by || "")} at ${clock(c.at)}${took}${c.note ? `<span class="meta"> · ${esc(c.note)}</span>` : ""}</span>
      <span class="decbtns">${exp}<button class="btn small" data-decide="clear">Undo</button></span></div>`;
  }
  return `<div class="decbar sticky"><span class="decfields">
      <label>Your initials <input id="dec-by" value="${esc(savedInitials())}" maxlength="40" autocomplete="off"></label>
      <label class="grow">Reason (optional) <input id="dec-note" maxlength="500" autocomplete="off" placeholder="For the record, e.g. home health confirmed by phone"></label>
      <span class="meta" id="dec-msg" role="status"></span></span>
    <span class="decbtns">${exp}<button class="btn approve" data-decide="approve">Approve</button><button class="btn deny" data-decide="deny">Deny</button></span></div>`;
}
function nextUndecided(after) {
  const list = state.packets.filter((x) => !x.coordinator && x.state === "done" && x.id !== after).sort((a, b) => a.added_at - b.added_at);
  return list[0] || null;
}

function factHTML(f) {
  const ev = f.evidence[0];
  const bad = f.checked === false;
  return `<div class="fact"><div class="fl">${esc(f.label)}</div><div class="fv ${f.value === "Not in the fax" ? "missing" : ""}">${esc(f.value)}
    ${bad ? `<span class="badge bad">Check by hand</span>` : ""}${f.form_only ? `<div class="formonly">Only the referral form says this.</div>` : ""}</div>
    <div class="fp">${ev ? `<button class="pagebtn" data-page="${ev.page}" data-quote="${esc(ev.quote)}" data-box="${ev.box ? esc(JSON.stringify(ev.box)) : ""}">p. ${ev.page}</button>` : ""}</div></div>`;
}
function profileHTML(pr) {
  if (!pr) return `<div class="card meta">The client profile isn't ready yet.</div>`;
  const P = pr.profile;
  const facts = P.sections.reduce((n, sec) => n + sec.facts.length, 0);
  return `<details class="profile" open><summary><span><b>Client profile</b><span class="meta"> · ${facts} facts, each with its page · names and dates are blacked out in the fax</span></span><span class="showwhy"></span></summary>
    <div class="psections">${P.sections.map((sec) => `<div class="psec"><h4>${esc(sec.title)}</h4>${sec.facts.map(factHTML).join("")}</div>`).join("")}</div>
  </details>`;
}

// "Before you say yes": what must be arranged (with its page) and what to ask the hospital for.
// Ticks are kept in this browser only, per packet.
function todoKey(r) { return `fetch-todo-${r.packet_id}-${(r.sha256 || "").slice(0, 12)}`; }
function loadTicks(r) { try { return JSON.parse(localStorage.getItem(todoKey(r)) || "{}"); } catch { return {}; } }
function todoHTML(r) {
  const rv = r.review, ticks = loadTicks(r);
  const items = [
    ...rv.findings.filter((f) => f.status === "arrange").map((f) => ({ text: f.headline, why: f.explanation, ev: f.evidence[0] })),
    ...rv.ask_hospital.map((a) => ({ text: a, why: "Ask the hospital: not in the fax." })),
  ];
  if (!items.length) return "";
  const done = items.filter((_, i) => ticks[i]).length;
  return `<h3>Before you say yes <span class="count">${done} of ${items.length} done</span></h3><div class="card todo">
    ${items.map((it, i) => `<div class="todo-item${ticks[i] ? " done" : ""}">
      <button class="tick" data-i="${i}" role="checkbox" aria-checked="${!!ticks[i]}" aria-label="Done: ${esc(it.text)}">${ticks[i] ? "✓" : ""}</button>
      <div class="txt"><div class="tt">${esc(it.text)}</div><div class="meta">${esc(it.why)}</div></div>
      ${it.ev ? `<button class="pagebtn" data-page="${it.ev.page}" data-quote="${esc(it.ev.quote)}" data-box="${it.ev.box ? esc(JSON.stringify(it.ev.box)) : ""}">Page ${it.ev.page}</button>` : ""}
    </div>`).join("")}</div>`;
}

function reviewHTML(r, name, profile) {
  const rv = r.review, s = rv.suggestion, qc = r.quote_check;
  const by = (st) => rv.findings.filter((f) => f.status === st);
  const cleared = r.cleared || {};
  const flagged = r.pages.filter((p) => p.possible_unredacted_identifier && !cleared[p.page]).map((p) => p.page);
  const clearedNote = Object.keys(cleared).length ? `<div class="card meta">A person checked page ${Object.keys(cleared).join(", ")}, which Fetch flagged as a possible missed redaction: ${Object.values(cleared).map(esc).join(" ")}</div>` : "";
  const quotes = [...rv.findings, ...rv.conflicts].flatMap((f) => f.evidence);
  const handCheck = quotes.filter((e) => !(e.check === "on_page" || e.check === "close") || (e.image_check && e.image_check !== "yes")).length;
  const mins = Math.floor(r.seconds / 60), secs = r.seconds % 60;
  const unchecked = rv.findings.filter((f) => !["problem", "arrange", "coordinator_call"].includes(f.status) && f.supported === false);
  const flaggedItems = [...by("problem"), ...by("coordinator_call"), ...by("arrange"), ...rv.conflicts, ...unchecked];
  const trustLine = handCheck
    ? `<span class="badge bad">${handCheck} of ${quotes.length} quotes to check by hand</span>`
    : `<span class="badge ok">✓ All ${quotes.length} quotes checked against the page text and image</span>`;
  return `
  ${clearedNote}${flagged.length ? `<div class="banner">Page ${flagged.join(", ")} may show an identifier the redaction missed. Stop and tell an organizer before going further.</div>` : ""}
  <div class="card verdict"><div style="flex:1">
    ${profile ? `<div class="client">${esc(profile.profile.one_line)}</div>` : ""}
    <div class="label">${esc(name)} · Fetch suggests</div>
    <div class="call ${s.decision}">${esc(suggestionText(s.decision, s.lean_if_forced))}</div>
    <div>${esc(s.why)}</div>
    <div class="trust"><span class="badge flagbadge">${flaggedItems.length} flagged for you</span>${trustLine}<span class="badge ok" title="SHA-256 ${esc(r.sha256 || "")}">✓ Original file unchanged</span></div>
    <p class="meta" style="margin:10px 0 0">Read ${r.page_count} page${r.page_count === 1 ? "" : "s"} in ${mins} min ${secs} s. Fetch suggests; the coordinator decides.</p>
  </div></div>
  ${profileHTML(profile)}
  <section class="flagged">
    <div class="flagged-head"><span class="flag-count">${flaggedItems.length}</span><div><h2>Flagged for the coordinator</h2>
      <div class="meta">${flaggedItems.length ? "What rules the patient out, what needs your judgment, what must be arranged first, where the pages disagree, and anything Fetch couldn't confirm." : "Nothing rules the patient out, needs your judgment or failed a check."}</div></div></div>
    ${flaggedItems.map((f) => findingHTML(f, taskFor(r.packet_id, f))).join("")}
  </section>
  ${groupsHTML(rv.findings)}
  ${todoHTML(r)}

  <p class="meta" style="margin-top:14px">${esc(rv.summary)}</p>
  <div class="row" style="margin-top:20px"><button class="btn" id="again">Fetch again</button><span class="meta">Checks the rules again on the pages already read.</span></div>`;
}

async function openViewer(page, quote, box) {
  const r = state.review;
  state.viewer = { page, quote };
  const hl = $("v-hl");
  hl.hidden = true;
  if (box) {
    const pad = 0.006;
    Object.assign(hl.style, { left: `${(box[0] - pad) * 100}%`, top: `${(box[1] - pad) * 100}%`,
      width: `${(box[2] - box[0] + 2 * pad) * 100}%`, height: `${(box[3] - box[1] + 2 * pad) * 100}%` });
    hl.hidden = false;
    $("v-img").onload = () => hl.scrollIntoView({ block: "center", behavior: "smooth" });
  } else { $("v-img").onload = null; }
  const info = r.pages.find((p) => p.page === page) || {};
  $("viewer").hidden = false;
  $("v-title").textContent = `Page ${page} of ${r.page_count}`;
  const notes = [info.kind ? info.kind.replace(/_/g, " ") : "", info.rotated ? "scanned sideways or upside down" : "", info.legibility && info.legibility !== "clear" ? info.legibility.replace(/_/g, " ") : ""].filter(Boolean);
  $("v-note").textContent = notes.join(" · ");
  if (info.possible_unredacted_identifier) $("v-note").innerHTML += `<div class="banner" style="margin-top:8px">This page may show an identifier the redaction missed. Stop and tell an organizer.</div>`;
  $("v-img").src = `/page/${r.packet_id}/${page}.png`;
  $("v-img").alt = `Page ${page} of packet ${r.packet_id}`;
  $("v-prev").disabled = page <= 1;
  $("v-next").disabled = page >= r.page_count;
  try {
    const t = await api(`/api/transcript/${r.packet_id}/${page}`);
    let html = esc(t.transcript);
    if (quote) {
      const i = t.transcript.toLowerCase().indexOf(quote.toLowerCase());
      if (i >= 0) {
        html = esc(t.transcript.slice(0, i)) + "<mark>" + esc(t.transcript.slice(i, i + quote.length)) + "</mark>" + esc(t.transcript.slice(i + quote.length));
        $("v-tr-wrap").open = true;
      }
    }
    $("v-tr").innerHTML = html;
  } catch { $("v-tr").textContent = "No transcript for this page."; }
}
function closeViewer() { $("viewer").hidden = true; state.viewer = null; }
$("v-close").onclick = closeViewer;
$("v-prev").onclick = () => openViewer(state.viewer.page - 1);
$("v-next").onclick = () => openViewer(state.viewer.page + 1);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.viewer) closeViewer(); });

function auditHTML(a) {
  if (!a) return "";
  const t = a.totals, n = t.correct + t.partly + t.wrong + t.unverifiable;
  const pct = (x) => `${Math.round(1000 * x / n) / 10}%`;
  const terr = Object.values(a.transcript_types).reduce((x, y) => x + y, 0);
  return `<h3>Independent accuracy audit</h3>
    <p class="meta">For each packet, a separate reviewer re-read the fax pages and graded every claim Fetch made, without seeing IHH's decisions. This audit graded ${esc(a.graded)}; the fixes it led to are listed in the README.</p>
    <div class="card"><p class="big">${t.correct} of ${n} claims correct (${pct(t.correct)})</p>
      <p class="meta">${t.partly} partly right (${pct(t.partly)}), ${t.wrong} wrong (${pct(t.wrong)}). Every quote was on the page it cited. In 22 spot-checked pages, ${terr} reading errors: ${Object.entries(a.transcript_types).map(([k, v]) => `${v} ${k}`).join(", ")}; most on sideways pages.</p></div>
    <table><thead><tr><th>Packet</th><th>Claims</th><th>Correct</th><th>Partly</th><th>Wrong</th><th>Reading errors</th><th>Reviewer's summary</th></tr></thead><tbody>
    ${a.rows.map((r) => `<tr><td>${r.id}</td><td>${r.claims}</td><td>${r.correct}</td><td>${r.partly}</td><td>${r.wrong ? `<b>${r.wrong}</b>` : 0}</td><td>${r.transcript_errors}</td><td class="meta">${esc(r.summary)}</td></tr>`).join("")}
    </tbody></table>`;
}

function denialsHTML(denials) {
  const intro = `<h3>Why IHH may have denied these</h3>
    <p class="meta">IHH didn't record its reasons. These are Claude's reading of each denied packet against IHH's rules, made afterwards with the decision known. They are guesses until IHH staff confirm them, and the review never sees them.</p>`;
  if (!denials) return intro + `<div class="card meta">No reasons worked out yet.</div>`;
  const tool = (d) => d.tool_flagged === undefined ? `<span class="meta">Not reviewed</span>`
    : d.tool_flagged.length ? `Yes: ${d.tool_flagged.map(esc).join(", ")}` : "<b>No</b>";
  return intro + `<table><thead><tr><th>Packet</th><th>Likely reason</th><th>Rules</th><th>Pages</th><th>Status</th><th>Tool flagged it</th></tr></thead><tbody>
    ${denials.map((d) => d.reason ? `<tr><td>${d.id}</td><td>${esc(d.reason)}${d.confidence ? `<div class="meta">Confidence: ${esc(d.confidence)}</div>` : ""}</td>
      <td>${(d.rule_ids || []).map(esc).join(", ")}</td><td>${(d.pages || []).join(", ")}</td>
      <td>${d.confirmed_by_ihh ? "Confirmed by IHH staff" : "Our guess"}</td><td>${tool(d)}</td></tr>`
      : `<tr><td>${d.id}</td><td colspan="5" class="meta">No likely reason found yet.</td></tr>`).join("")}
  </tbody></table>`;
}

async function renderScore(quiet) {
  const { rows, denials, audit } = await api("/api/score");
  const done = rows.filter((r) => r.state === "done");
  const matched = done.filter((r) => r.match).length;
  const withBefore = rows.filter((r) => r.before);   // past runs are saved, so they always count every packet
  const matchedBefore = withBefore.filter((r) => r.before.match).length;
  const withSecond = rows.filter((r) => r.second), matchedSecond = withSecond.filter((r) => r.second.match).length;
  const withThird = rows.filter((r) => r.third), matchedThird = withThird.filter((r) => r.third.match).length;
  const waiting = rows.filter((r) => r.state !== "done" && r.state !== "running");
  const running = rows.filter((r) => r.state === "running");
  const quotes = done.reduce((a, r) => a + r.quote_check.quotes, 0);
  const both = (q) => q.image ? Math.min(q.on_page + q.close, q.image.seen) : q.on_page + q.close;
  const ok = done.reduce((a, r) => a + both(r.quote_check), 0);
  const head = done.length
    ? `<p class="big">${done.length < rows.length ? `Matched IHH on ${matched} of the ${done.length} finished so far` : `Matched IHH's decision on ${matched} of ${rows.length} packets`}</p>
       ${done.length < rows.length ? `<p class="meta">${rows.length - done.length} of ${rows.length} packets are being reviewed again right now (${rows.filter((r) => r.state !== "done").map((r) => r.id).join(", ")}); the score covers all ${rows.length} when they finish.</p>` : ""}
       ${withBefore.length ? `<p class="meta">First run: ${matchedBefore} of ${withBefore.length}.${withSecond.length ? ` Second run: ${matchedSecond} of ${withSecond.length}.` : ""}${withThird.length ? ` Third run: ${matchedThird} of ${withThird.length}.` : ""} Since the first run, two rules were changed, both taken from IHH's documents: unknowns never count against the patient, and "allowed if arranged" rules mean approve once arranged. The third run added accuracy fixes from an independent audit of Fetch's readings; none of those fixes used IHH's decisions. The latest run adds one rule found by studying a disagreement with IHH: a value can't rule a patient out when another reading of it is blacked out or the diagnosis behind the rule isn't confirmed. Because changes came after seeing results, a packet Fetch hasn't seen is the fairest test.</p>` : ""}
       <p class="meta">${ok} of ${quotes} quotes checked against the page text and image. When Fetch asks for more information, its leaning is what's compared with IHH.</p>`
    : `<p class="big">No packets reviewed yet</p><p class="meta">Review the packets to compare the tool with what IHH actually decided.</p>`;
  const ihhChip = (d) => `<span class="chip2 ${d}">${d === "approve" ? "Approved" : "Denied"}</span>`;
  const fetchChip = (r) => { const cls = r.decision === "need_more_info" ? "info" : (["approve", "approve_once_arranged"].includes(r.decision) ? "approve" : "deny"); return `<span class="chip2 ${cls}">${esc(suggestionText(r.decision, r.lean))}</span>`; };
  const past = (x) => x ? `${esc(suggestionText(x.decision, x.lean))} ${x.match ? '<span class="green">✓</span>' : '<span class="red">✗</span>'}` : "";
  const table = `<table class="scoretable"><thead><tr><th>Packet</th><th>IHH decided</th><th>Fetch suggests now</th><th>Match</th><th>First run</th><th>Second run</th><th>Third run</th><th>Pages</th><th title="A fresh, full scan of this referral: every page read, every rule checked, every quote checked twice, client profile built.">Time to scan</th><th>Quotes checked</th></tr></thead><tbody>
    ${rows.map((r) => r.state === "done" ? `<tr><td><b>${r.id}</b></td><td>${ihhChip(r.ihh)}</td><td>${fetchChip(r)}</td>
      <td class="matchcell">${r.match ? '<span class="green">✓ Yes</span>' : '<span class="red">✗ No</span>'}</td>
      <td class="meta">${past(r.before)}</td><td class="meta">${past(r.second)}</td><td class="meta">${past(r.third)}</td><td>${r.pages}</td><td>${r.scan_seconds ? `${Math.floor(r.scan_seconds / 60)} min ${String(r.scan_seconds % 60).padStart(2, "0")} s` : '<span class="meta">Measuring…</span>'}</td><td>${both(r.quote_check)} of ${r.quote_check.quotes}</td></tr>`
      : `<tr><td><b>${r.id}</b></td><td>${ihhChip(r.ihh)}</td><td colspan="8" class="meta">${r.state === "running" ? "Reviewing…" : r.state === "error" ? "Stopped" : "Not reviewed"}</td></tr>`).join("")}
  </tbody></table>`;
  $("main").innerHTML = `<div class="card">${head}
    ${waiting.length ? `<div class="row"><button class="btn primary" id="all">Review ${waiting.length} remaining</button><span class="meta">Reads each packet once; about three minutes each, several at a time.</span></div>` : ""}
    ${running.length ? `<p class="meta"><span class="spinner"></span>&nbsp; Reviewing ${running.length}…</p>` : ""}
    </div>${table}
    <p class="meta">IHH's real decisions are used only on this screen, after a review is done. The review never sees them. IHH did not record reasons, so a match on the decision does not prove the reasons match. Eleven packets is a small test: a good score here shows the tool isn't broken, not that it is reliable.</p>
    ${denialsHTML(denials)}
    ${auditHTML(audit)}`;
  const all = $("all");
  if (all) all.onclick = async () => {
    all.disabled = true;
    for (const r of waiting) await api(`/api/review/${r.id}`, { method: "POST" });
    await refresh();
  };
}

function setTab() {
  $("tab-queue").setAttribute("aria-pressed", state.view === "queue" || state.view === "packet");
  $("tab-tasks").setAttribute("aria-pressed", state.view === "tasks");
  $("tab-score").setAttribute("aria-pressed", state.view === "score");
}
$("tab-queue").onclick = showQueue;
$("tab-tasks").onclick = showTasks;
$("tab-score").onclick = async () => { state.view = "score"; setTab(); closeViewer(); await renderScore(); };

$("file").onchange = () => { if ($("file").files[0]) uploadFile($("file").files[0]); };
async function uploadFile(f) {
  try {
    const p = await api("/api/upload", { method: "POST", body: await f.arrayBuffer(), headers: { "Content-Type": "application/octet-stream" } });
    $("file").value = "";
    await refresh();
    await select(p.id);
    await refresh();
  } catch (e) { alert(e.message); }
}

// The four steps a review goes through, worked out from the step text the server reports.
function progressHTML(name, step) {
  const read = step.match(/Read (\d+) of (\d+) page/);
  const total = (step.match(/(\d+) page/) || [])[1];
  let at = 1;
  if (/Reading|Read \d/.test(step)) at = 2;
  if (/against IHH/.test(step)) at = 3;
  if (/quote/.test(step)) at = 4;
  const waiting = /Waiting/.test(step);
  const labels = [
    total && at > 1 ? `Opened the fax: ${read ? read[2] : total} pages` : "Opening the fax",
    read ? `Reading the pages: ${read[1]} of ${read[2]}` : "Reading the pages",
    "Checking IHH's admission rules",
    "Double-checking every quote against the fax",
  ];
  const rows = labels.map((label, i) => {
    const n = i + 1, cls = waiting ? "next" : n < at ? "done" : n === at ? "now" : "next";
    const bar = n === 2 && read && at === 2 ? `<div class="pbar"><i style="width:${Math.round(100 * read[1] / read[2])}%"></i></div>` : "";
    return `<div class="pstep"><span class="dot ${cls}">${cls === "done" ? "✓" : n}</span>${label}</div>${bar}`;
  }).join("");
  return `<div class="steps fetching"><div class="mini-fax" aria-hidden="true">${'<i></i>'.repeat(9)}<span class="mini-scan"></span></div><div><h2 style="margin:0 0 10px;font-size:20px">Fetching ${esc(name)}</h2>${rows}</div></div>
    <p class="meta" style="margin-top:12px">${waiting ? "Waiting for another review to finish." : "About 3 minutes. You can open another packet while you wait."}</p>`;
}

function showWelcome() {
  $("main").innerHTML = `<div class="drop" id="drop">
    <h2>Drop a referral fax here</h2>
    <p>A PDF or a photo. Fetch reads every page and checks it against IHH's admission rules.</p>
    <button class="btn primary" id="choose">Choose a file</button></div>
    <p class="acro" style="text-align:center;margin-top:18px"><b>F</b>inds the <b>E</b>vidence · <b>T</b>races it to the page · <b>C</b>hecks it twice · <b>H</b>ands it to you</p>
    <p class="meta" style="text-align:center">Or pick one of IHH's eleven packets.</p>`;
  $("choose").onclick = () => $("file").click();
  const drop = $("drop");
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); if (e.dataTransfer.files[0]) uploadFile(e.dataTransfer.files[0]); };
}

refresh();
</script>
</body>
</html>
